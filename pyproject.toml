[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
# Dev-only, macOS-gated: the speech libs are excluded from the workers' runtime
# deps on macOS (prod images pin them via the Dockerfiles).
dev = [
    "faster-whisper>=1.0.0 ; sys_platform == 'darwin'",
    "silero-vad>=6.0.0 ; sys_platform == 'darwin'",
    "speechbrain>=1.0.0 ; sys_platform == 'darwin'",
    "pyyaml>=6.0",
    # WER for the ASR gold-set harness (scripts/eval/asr_eval.py).
    "jiwer>=3.0,<5",
]


[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are immutable singletons as argument defaults (B008).
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.isort]
known-first-party = [
    "template_service",
    "auth_service",
    "asr_service",
    "asr_worker",
    "dictation_service",
    "nlp_service",
    "note_service",
    "notification_service",
    "observability",
    "auth",
    "db",
    "audit",
    "messaging",
    "secret",
    "crypto",
    "storage",
    "asr_models",
    "template_models",
    "note_models",
    "notification_events",
    "diarization",
    "models",
    "jobs",
    "ratelimit",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["dist/", ".venv/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

# import-linter contracts, enforced in CI; relaxing one requires an ADR amendment.
[tool.importlinter]
root_packages = [
    "template_service",
    "auth_service",
    "asr_service",
    "asr_worker",
    "dictation_service",
    "nlp_service",
    "note_service",
    "observability",
    "secret",
    "auth",
    "db",
    "audit",
    "messaging",
    "crypto",
    "storage",
    "asr_models",
    "template_models",
    "note_models",
    "notification_service",
    "notification_events",
    "generation_service",
    "diarization",
    "models",
    "jobs",
    "ratelimit",
]

[[tool.importlinter.contracts]]
name = "Layered architecture in services: routers → domain, never reverse"
type = "layers"
layers = [
    "template_service.routers",
    "template_service.domain",
]

[[tool.importlinter.contracts]]
name = "generation-service: routers → domain → adapters; reverse forbidden"
type = "layers"
layers = [
    "generation_service.routers",
    "generation_service.domain",
    "generation_service.adapters",
]

[[tool.importlinter.contracts]]
name = "asr-service: routers → domain → adapters; reverse forbidden"
type = "layers"
layers = [
    "asr_service.routers",
    "asr_service.domain",
    "asr_service.adapters",
]

[[tool.importlinter.contracts]]
name = "dictation-service: routers / ws → session / inference / audio → adapters"
type = "layers"
layers = [
    "dictation_service.routers",
    "dictation_service.ws",
    "dictation_service.session",
    "dictation_service.diarization",
    "dictation_service.inference",
    "dictation_service.audio",
    "dictation_service.protocol",
    "dictation_service.adapters",
]

# `pipeline.base` (the kernel) is split out below `stages`; the orchestrator
# sits above them because it threads stages while stages import only the kernel.
[[tool.importlinter.contracts]]
name = "nlp-service: api/routers → domain → orchestrator → stages → kernel; reverse forbidden"
type = "layers"
layers = [
    "nlp_service.api",
    "nlp_service.routers",
    "nlp_service.domain",
    "nlp_service.pipeline.orchestrator",
    "nlp_service.stages",
    "nlp_service.pipeline.base",
    "nlp_service.adapters",
]

[[tool.importlinter.contracts]]
name = "note-service: routers → domain → adapters; reverse forbidden"
type = "layers"
layers = [
    "note_service.routers",
    "note_service.domain",
    "note_service.adapters",
]

# `ws` sits BELOW `ingest` and `delivery`: both publish WebSocket fan-out.
# `delivery` and `ingest` have no edge; dead-lettering lives in `domain.dead_letters`.
[[tool.importlinter.contracts]]
name = "notification-service: routers → delivery → ingest → ws → domain → adapters; reverse forbidden"
type = "layers"
layers = [
    "notification_service.routers",
    "notification_service.delivery",
    "notification_service.ingest",
    "notification_service.ws",
    "notification_service.domain",
    "notification_service.adapters",
]

# auth-service: only domain/ and adapters/ are layered; the older root modules
# predate the split.
[[tool.importlinter.contracts]]
name = "auth-service: routers → delivery → domain → adapters; reverse forbidden"
type = "layers"
layers = [
    "auth_service.routers",
    "auth_service.delivery",
    "auth_service.domain",
    "auth_service.adapters",
]

[[tool.importlinter.contracts]]
name = "notification_events is a leaf — pure Pydantic types"
type = "forbidden"
source_modules = ["notification_events"]
forbidden_modules = [
    "observability", "secret", "auth", "db", "audit", "messaging",
    "crypto", "storage", "asr_models", "template_models", "note_models",
]

[[tool.importlinter.contracts]]
name = "template_models is a leaf — pure Pydantic types"
type = "forbidden"
source_modules = ["template_models"]
forbidden_modules = [
    "observability", "secret", "auth", "db", "audit", "messaging",
    "crypto", "storage", "asr_models", "note_models",
]

[[tool.importlinter.contracts]]
name = "note_models is a leaf — pure Pydantic types"
type = "forbidden"
source_modules = ["note_models"]
forbidden_modules = [
    "observability", "secret", "auth", "db", "audit", "messaging",
    "crypto", "storage", "asr_models", "template_models",
]

[[tool.importlinter.contracts]]
name = "diarization is a leaf — it must not depend on other internal libs"
type = "forbidden"
source_modules = ["diarization"]
forbidden_modules = [
    "observability", "secret", "auth", "db", "audit", "messaging",
    "crypto", "storage", "asr_models", "template_models", "note_models",
    "notification_events",
]

[[tool.importlinter.contracts]]
name = "Libs may not import services"
type = "forbidden"
source_modules = [
    "observability",
    "secret",
    "auth",
    "db",
    "audit",
    "messaging",
    "crypto",
    "storage",
    "asr_models",
    "template_models",
    "note_models",
    "notification_events",
    "diarization",
    "models",
    "jobs",
    "ratelimit",
]
forbidden_modules = [
    "template_service",
    "asr_service",
    "asr_worker",
    "dictation_service",
    "nlp_service",
    "note_service",
    "notification_service",
]

# Services are mutually independent; shared concerns live in libs/*.
# One recorded exception: dictation-service reuses asr-worker's `WhisperEngine`
# (coupling debt; should become a `libs/asr_inference` package).
[[tool.importlinter.contracts]]
name = "Services may not import other services"
type = "independence"
modules = [
    "template_service",
    "asr_service",
    "asr_worker",
    "dictation_service",
    "nlp_service",
    "note_service",
    "notification_service",
]
ignore_imports = [
    "dictation_service.main_deps -> asr_worker.inference",
]

# libs/models is the ONLY package allowed to know a model vendor.
[[tool.importlinter.contracts]]
name = "models depends on asr_models only — never on auth/db/storage/services"
type = "forbidden"
source_modules = ["models"]
forbidden_modules = [
    "observability", "secret", "auth", "db", "audit", "messaging", "crypto", "storage",
    "template_models", "note_models", "notification_events", "diarization",
]

# libs/jobs never layers on tenancy/auth, storage, crypto or messaging.
[[tool.importlinter.contracts]]
name = "jobs depends on db, models, observability only"
type = "forbidden"
source_modules = ["jobs"]
forbidden_modules = [
    "secret", "auth", "audit", "messaging", "crypto", "storage",
    "template_models", "note_models", "notification_events", "diarization",
]

[[tool.importlinter.contracts]]
name = "observability is a leaf — it must not depend on other internal libs"
type = "forbidden"
source_modules = ["observability"]
forbidden_modules = [
    "secret", "auth", "db", "audit", "messaging", "crypto", "storage", "asr_models",
]

[[tool.importlinter.contracts]]
name = "secret is a leaf — it must not depend on other internal libs"
type = "forbidden"
source_modules = ["secret"]
forbidden_modules = [
    "observability", "auth", "db", "audit", "messaging", "crypto", "storage", "asr_models",
]

[[tool.importlinter.contracts]]
name = "asr_models is a leaf — pure Pydantic types"
type = "forbidden"
source_modules = ["asr_models"]
forbidden_modules = [
    "observability", "secret", "auth", "db", "audit", "messaging", "crypto", "storage",
]

[[tool.importlinter.contracts]]
name = "crypto must not depend on storage or messaging"
type = "forbidden"
source_modules = ["crypto"]
forbidden_modules = ["storage", "messaging", "audit", "auth", "db", "observability"]

[[tool.importlinter.contracts]]
name = "storage layers on crypto only — not auth/audit/db"
type = "forbidden"
source_modules = ["storage"]
forbidden_modules = ["auth", "audit", "db", "messaging", "observability"]

# Root `tests/` tree only (async suites that strict mode would silently skip);
# per-package test config lives in each member's own pyproject.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
