name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.4.29"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}

      - name: Install dev tools
        working-directory: services/_template
        run: uv pip install --system -e ".[dev]"

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        run: |
          uv run mypy --strict \
            services/_template/src/ \
            libs/observability/src/ \
            libs/secret/src/ \
            libs/auth/src/ \
            libs/db/src/ \
            libs/audit/src/ \
            libs/messaging/src/

  import-linter:
    name: Architectural contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Install import-linter and project libs
        run: |
          uv pip install --system import-linter>=2.0
          for d in libs/*/ services/*/; do
            uv pip install --system -e "$d"
          done
      - name: lint-imports
        run: make lint-imports   # single definition lives in the Makefile

  gates:
    name: Architectural gates (custom scanners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      # Via make so the gate definitions have one source of truth.
      - name: Custom architectural gates
        run: |
          make check-no-os-environ
          make check-no-direct-asyncpg
          make check-audit-insert
          make check-no-object-storage
          make check-no-crypto
          make check-identity-grants
          make check-auth-issuer-config
          make validate-templates
          make check-no-demo-envvars-in-prod
          make check-no-vendor-import
          make check-dev-keys
          make check-no-eval-audio
          make check-routing-report

  # Chart renders, prod render is secret-clean, vendored ops files match source.
  k8s-render:
    name: K8s chart render & gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.2
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Render + gate
        run: make check-k8s-rendered

  test:
    name: Tests (coverage ≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}

      - name: Install template service + dev deps
        working-directory: services/_template
        run: uv pip install --system -e ".[dev]"

      - name: pytest with coverage
        working-directory: services/_template
        env:
          TESTING: "true"
          OTEL_SDK_DISABLED: "true"
        run: |
          uv run pytest tests/ \
            --cov=template_service \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: services/_template/coverage.xml
          flags: template-service

  # Needs the whole checkout (error-copy test reads docs/api/error-codes.md).
  # Type-checks web/e2e/ but does not run it: those specs need a live stack
  # (`make web-e2e`).
  web:
    name: Web — type-check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # The only raw-HTML sink allowed is the locally generated QR code.
      - name: No raw HTML from data
        run: npm run check:no-danger
      - name: Production build
        run: npm run build

  # Document engine with the scripted provider: deterministic and offline.
  # Model-quality numbers are the self-hosted `nightly-notes` workflow's job.
  notes-engine:
    name: Notes engine — scripted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Touches the engine?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(services/note-service/src/note_service/domain/meeting_doc/|scripts/eval/|tests/fixtures/eval/notes/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: steps.scope.outputs.run == 'true'
        run: pip install uv==${{ env.UV_VERSION }}

      - name: Engine tests (scripted provider)
        if: steps.scope.outputs.run == 'true'
        run: >
          uv run --project services/note-service --with pyyaml pytest -q
          services/note-service/tests/unit/test_meeting_doc_engine.py
          services/note-service/tests/unit/test_meeting_doc_prompts.py
          services/note-service/tests/unit/test_meeting_doc_lines.py
          services/note-service/tests/unit/test_meeting_doc_q2.py
          services/note-service/tests/unit/test_meeting_doc_q3.py
          services/note-service/tests/unit/test_meeting_doc_q4.py
          services/note-service/tests/unit/test_meeting_doc_q5.py
          services/note-service/tests/unit/test_note_title.py

      - name: Eval scorers, gold format and checklist tests
        if: steps.scope.outputs.run == 'true'
        run: >
          uv run --project services/note-service --with pyyaml pytest -q
          tests/unit/test_notes_scoring.py tests/unit/test_notes_gold.py
          tests/unit/test_notes_gates.py

      - name: Gold format (fixtures)
        if: steps.scope.outputs.run == 'true'
        run: uv run --project services/note-service python scripts/eval/notes_gold.py tests/fixtures/eval/notes

      - name: Regression checklists (scripted provider)
        if: steps.scope.outputs.run == 'true'
        run: uv run --project services/note-service --with pyyaml python scripts/eval/notes_assert.py --backend scripted

  macos-app:
    name: macOS app — build & tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Tests
        run: swift test

  # Signup smoke against a live stack supplied as secrets (macOS runners
  # have no Docker); skipped unless MAC_SMOKE_ENABLED.
  macos-signup-smoke:
    name: macOS app — signup smoke (live stack)
    runs-on: macos-15
    needs: macos-app
    if: vars.MAC_SMOKE_ENABLED == 'true'
    defaults:
      run:
        working-directory: macos
    env:
      MAC_SMOKE_AUTH_URL: ${{ secrets.MAC_SMOKE_AUTH_URL }}
      MAC_SMOKE_ASR_URL: ${{ secrets.MAC_SMOKE_ASR_URL }}
      MAC_SMOKE_NOTE_URL: ${{ secrets.MAC_SMOKE_NOTE_URL }}
      MAC_SMOKE_FIXTURE: ${{ secrets.MAC_SMOKE_FIXTURE }}
    steps:
      - uses: actions/checkout@v4
      # A missing secret would otherwise be a silent XCTSkip in a green job.
      - name: Stack is configured
        run: |
          for name in MAC_SMOKE_AUTH_URL MAC_SMOKE_ASR_URL MAC_SMOKE_NOTE_URL MAC_SMOKE_FIXTURE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; unset MAC_SMOKE_ENABLED or add the secret"
              exit 1
            fi
          done
      - name: Signup smoke
        run: swift test --filter SignupSmokeTests

  ios-app:
    name: iOS app — build, tests & ATS
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Type-check
        run: scripts/check.sh
      - name: Tests
        run: scripts/test.sh "iPhone 16"
      # ATS is asserted on the built product (the policy comes from the Info.plist preprocessor).
      - name: Release build
        run: scripts/build-sim.sh Release
      - name: App Transport Security
        run: scripts/check-ats.sh
      # Needs a live stack (no Docker on macOS runners); visible skip without
      # NOTES_STACK_HOST. LiveStackTests are still compiled on every push.
      - name: End-to-end smoke (needs a stack)
        if: vars.NOTES_STACK_HOST != ''
        env:
          NOTES_STACK_HOST: ${{ vars.NOTES_STACK_HOST }}
        run: |
          scripts/test.sh "iPhone 16"
          cd .. && make smoke-ios ARGS="--auth http://$NOTES_STACK_HOST:8000 \
            --asr http://$NOTES_STACK_HOST:8001 --note http://$NOTES_STACK_HOST:8006"

  # Same config as `make secret-scan`; full history so a squashed leak is found.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # `apply` is never run from a PR; see hf-endpoints-apply.yml (manual).
  hf-endpoints-plan:
    name: HF endpoints — validate + plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages
      - name: Validate specs (offline)
        run: uv run python scripts/models/hf_endpoints.py validate
      - name: Plan against staging (drift fails)
        if: ${{ secrets.HF_TOKEN_STAGING != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_STAGING }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
        run: uv run python scripts/models/hf_endpoints.py plan --env staging

  security:
    name: Security scans (bandit + semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}

      - name: Install bandit
        run: uv pip install --system "bandit[toml]>=1.7.8"

      - name: bandit SAST
        run: |
          uv run bandit -r services/ libs/ \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-report.json || true
          uv run bandit -r services/ libs/ --severity-level high --exit-zero

      - name: semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
            p/secrets

  container-scan:
    name: Build & scan container (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Docker image
        run: |
          docker build \
            -t template-service:ci \
            services/_template/

      - name: Image carries no token (DEP-S1-05)
        run: bash scripts/ci/check-image-no-secrets.sh template-service:ci

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: template-service:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  publish:
    name: Build & push to GHCR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, import-linter, gates, test, security, container-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (semver tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/template-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/_template
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
