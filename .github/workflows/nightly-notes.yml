# Nightly notes-engine eval (pipeline vs single_pass arms) against the
# committed baseline. Self-hosted (`mdx-eval`): the real gold set is never
# committed and the stack model runs on the eval Mac.
name: nightly-notes

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      corpus:
        description: "Corpus directory (default: the committed synthetic set)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-notes
  cancel-in-progress: false

env:
  # Committed baseline; update in a PR only when a change is MEANT to move the numbers.
  BASELINE_PIPELINE: docs/eval/notes-baseline-pipeline.json
  MAX_UNSUPPORTED_RISE: "0.01"
  MAX_RECALL_DROP: "0.02"
  DEV_MAC_MODEL_URL: http://localhost:11434/v1

jobs:
  notes:
    runs-on: [self-hosted, macOS, mdx-eval]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync
        run: uv sync --all-packages

      - name: Corpus
        id: corpus
        env:
          CORPUS_INPUT: ${{ github.event.inputs.corpus }}
        run: |
          set -euo pipefail
          corpus="${CORPUS_INPUT:-${NOTES_CORPUS:-tests/fixtures/eval/notes}}"
          test -d "$corpus" || { echo "::error::corpus not found: $corpus"; exit 3; }
          echo "path=$corpus" >> "$GITHUB_OUTPUT"

      - name: Gold set is valid
        run: make eval-notes-validate CORPUS="${{ steps.corpus.outputs.path }}"

      - name: Stack model
        run: make dev-model ARGS=start

      # Sprint P3: the writer (P1) writes the corpus and the scoring harness measures it
      # the same way the six assessed recordings are measured (docs/eval/writer-v2-<date>.md).
      - name: Write and score the corpus
        run: make score-notes-fixtures BACKEND=dev_mac CORPUS="${{ steps.corpus.outputs.path }}" LABEL=nightly

      - name: Regression against the committed baseline
        run: |
          set -euo pipefail
          baseline=docs/eval/writer-v2-baseline.json
          latest=$(ls -t docs/eval/writer-v2-*-nightly.json | head -1)
          if [ ! -f "$baseline" ]; then echo "no baseline committed yet: $latest is the first"; exit 0; fi
          uv run python - "$baseline" "$latest" <<'PY'
          import json, statistics, sys
          base, now = (json.load(open(p)) for p in sys.argv[1:3])
          def mean(rows, key):
              vals = [r[key] for r in rows if isinstance(r.get(key), (int, float))]
              return statistics.fmean(vals) if vals else None
          drop = (mean(base["rows"], "hand_recall") or 0) - (mean(now["rows"], "hand_recall") or 0)
          rise = (mean(now["rows"], "judge_unsupported_rate") or 0) - (mean(base["rows"], "judge_unsupported_rate") or 0)
          print(f"recall drop {drop:.3f} (max {MAX_RECALL_DROP}), unsupported rise {rise:.3f} (max {MAX_UNSUPPORTED_RISE})".replace("MAX_RECALL_DROP", "${{ env.MAX_RECALL_DROP }}").replace("MAX_UNSUPPORTED_RISE", "${{ env.MAX_UNSUPPORTED_RISE }}"))
          sys.exit(1 if drop > float("${{ env.MAX_RECALL_DROP }}") or rise > float("${{ env.MAX_UNSUPPORTED_RISE }}") else 0)
          PY

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-reports
          path: |
            docs/eval/writer-v2-*.md
            docs/eval/writer-v2-*.json
          retention-days: 30
