# cand_parakeet_asr: bake-off arm C (ADR-0067), our own deploy/asr-server image
# (weights baked, hub offline) on the same route as hf_eu_asr.
name: notes-asr-parakeet-{env}
task: custom
type: protected
model:
  # Provenance only; the weights are baked.
  repository: nvidia/parakeet-tdt-0.6b-v3
  revision: 541d1f99c6b0c3cd0b11a95167540bb8edefd82b   # docs/models/PINS.md (fetched 2026-10-01)
  framework: pytorch
  image:
    custom:
      url: ghcr.io/notes-ai/asr-server:{tag}
      port: 8082
      health_route: /health
      env:
        MDX_ASR_RUNTIME: nemo
        MDX_ASR_DEVICE: cuda
        MDX_ASR_MODEL_PATH: /opt/models/parakeet/parakeet-tdt-0.6b-v3.nemo
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
        # From the endpoint's secret store; the process refuses to start without it.
provider:
  vendor: aws
  region: eu-west-1
compute:
  accelerator: gpu
  instance_type: nvidia-t4
  instance_size: x1
  scaling:
    min_replica: 0          # a candidate: idle GPU costs real money
    max_replica: 1
    scale_to_zero_timeout: 15
