# hf_eu_diar: speaker diarization (ADR-0052), our own deploy/diar-server image
# with the weights baked (no upstream `model.repository` to serve).
name: notes-diar-{env}
task: custom
type: protected
model:
  # Provenance only; the weights are baked.
  repository: pyannote/speaker-diarization-community-1
  revision: 3533c8cf8e369892e6b79ff1bf80f7b0286a54ee   # docs/models/PINS.md
  framework: pytorch
  image:
    custom:
      url: ghcr.io/notes-ai/diar-server:{tag}
      port: 8081
      health_route: /health
      env:
        MDX_DIAR_DEVICE: cuda
        MDX_DIAR_V2_MODEL_DIR: /opt/models/pyannote-community-1
        MDX_DIAR_V2_BATCH: "32"
        PYANNOTE_METRICS_ENABLED: "false"   # pyannote.audio 4.x defaults this ON
        HF_HUB_OFFLINE: "1"
        # From the endpoint's secret store; the process refuses to start without it.
provider:
  vendor: aws
  region: eu-west-1
compute:
  accelerator: gpu
  instance_type: nvidia-t4
  instance_size: x1
  scaling:
    min_replica: 0          # diarization is bursty; idle GPU costs real money
    max_replica: 2
    scale_to_zero_timeout: 15
