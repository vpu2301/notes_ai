# Note-generation alerts: the engine failing QUIETLY (loud failures show in
# the note). Instruments: note_service/generation_metrics.py, libs/jobs metrics.py.
groups:
  - name: note-generation
    interval: 30s
    rules:
      - alert: NoteGenerationFailureRate
        # Individual failures are normal; a fifth failing means the engine is broken for somebody.
        expr: |
          (sum(increase(mdx_note_generations_total{outcome=~"failed|partial"}[30m])) or vector(0))
          /
          clamp_min(sum(increase(mdx_note_generations_total[30m])) or vector(0), 1)
          > 0.2
        for: 15m
        labels:
          severity: warn
          team: notes
        annotations:
          summary: "More than a fifth of note generations failed in the last 30 min"
          description: |
            Generations are failing or coming back partial. Check note-worker logs for error_kind, and whether the chat backend is degraded (ModelBackend* alerts fire first when it is).
            Runbook: docs/runbooks/notes.md#generation-failures

      - alert: NoteGenerationSlow
        # Ten minutes at p95: the queue is behind or the backend is crawling.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(mdx_note_generation_seconds_histogram_bucket[30m]))) > 600
        for: 15m
        labels:
          severity: warn
          team: notes
        annotations:
          summary: "p95 note generation is over 10 minutes"
          description: |
            Generations are taking far longer than a meeting's worth of work. Check queue depth, worker replicas and the backend's own latency.
            Runbook: docs/runbooks/notes.md#generation-slow

      - alert: NoteSnapshotSweepStopped
        # Snapshots are whole transcripts; a stopped sweep breaks a retention promise.
        expr: |
          (sum(increase(mdx_note_generation_snapshots_swept_total[48h])) or vector(0)) == 0
          and
          (sum(increase(mdx_note_generations_total[48h])) or vector(0)) > 50
        for: 2h
        labels:
          severity: warn
          team: notes
        annotations:
          summary: "No transcript snapshots swept in 48 h while notes were being written"
          description: |
            Either the sweeper is not running (MDX_BACKGROUND_JOBS on the API deployment) or every delete is failing. Snapshots older than a day are a retention breach, not untidiness.
            Runbook: docs/runbooks/notes.md#snapshot-sweep

      - alert: NoteGenerationBudgetBlocked
        # Not an outage: answers "notes stopped and nobody said why" in one look.
        expr: |
          (sum by (reason) (increase(mdx_note_generation_budget_blocked_total[1h])) or vector(0)) > 0
        for: 0m
        labels:
          severity: info
          team: notes
        annotations:
          summary: "Generations blocked in the last hour ({{ $labels.reason }})"
          description: |
            A workspace is over its monthly AI budget or has generation turned off. Its admins were notified once for the month; nothing to fix unless they ask.
            Runbook: docs/runbooks/notes.md#budget

      - alert: NoteWriterConflicts
        # The writer never overwrites an author; a spike means its output is not landing.
        expr: |
          (sum(increase(mdx_notes_autosave_conflicts_total[30m])) or vector(0)) > 20
        for: 15m
        labels:
          severity: warn
          team: notes
        annotations:
          summary: "Writer conflicts spiking (over 20 in 30 min)"
          description: |
            Generated sections are repeatedly failing to land because the note changed underneath them. Expected in bursts while people edit; sustained means the writer's compare-and-set is fighting an autosave loop.
            Runbook: docs/runbooks/notes.md#writer-conflicts
