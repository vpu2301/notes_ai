groups:
  - name: asr-health
    interval: 30s
    rules:
      - alert: AsrQueueDepthHigh
        expr: max_over_time(mdx_asr_queue_depth[5m]) > 100
        for: 5m
        labels:
          severity: page
          team: asr
        annotations:
          summary: "ASR job queue depth has exceeded 100 for 5m"
          description: |
            The Redis Streams stream {{ $labels.stream }} has more than 100 pending
            jobs sustained for 5 minutes. Capacity may need scaling. Check
            worker liveness + scale `asr-worker` replicas.

      - alert: AsrWorkerErrorRate
        expr: |
          sum(rate(mdx_asr_jobs_total{status="failed"}[10m]))
            /
          sum(rate(mdx_asr_jobs_total[10m])) > 0.05
        for: 10m
        labels:
          severity: page
          team: asr
        annotations:
          summary: "ASR worker failure rate > 5% over 10m"
          description: "Investigate via traces; check GPU + ffmpeg + OOM rates."

      - alert: AsrRealtimeFactorLow
        expr: avg_over_time(mdx_asr_realtime_factor[5m]) < 0.5
        for: 5m
        labels:
          severity: warn
          team: asr
        annotations:
          summary: "ASR worker is running slower than 0.5x realtime"
          description: |
            audio_duration / infer_seconds < 0.5 sustained 5m. Likely causes:
            CPU fallback, GPU contention, or model loaded with the wrong
            compute_type (fp32 instead of fp16).

      - alert: AsrOomBurst
        expr: increase(mdx_asr_oom_total[10m]) >= 3
        for: 0m
        labels:
          severity: page
          team: asr
        annotations:
          summary: "Three or more CUDA OOMs in the last 10m"

      - alert: AsrMasterKeyMissing
        # Worker not started (model_loaded=0) for > 5m while the queue has work.
        expr: mdx_asr_model_loaded == 0
        for: 5m
        labels:
          severity: page
          team: security
        annotations:
          summary: "asr-worker model is not loaded"
          description: |
            Check: is the worker running? Is /etc/mdx/master.key mounted with
            mode 0400? See docs/runbooks/asr-worker.md § master-key-missing.

      - alert: AsrGpuMemoryHigh
        expr: max_over_time(mdx_asr_gpu_memory_peak_mb[15m]) > 0.9 * 24576
        for: 5m
        labels:
          severity: warn
          team: asr
        annotations:
          summary: "GPU peak memory > 90% of 24 GB card for 3 jobs in a row"
          description: "Consider reducing beam size or chunk length."

      # The guard removes prompt echo and counts it; > 20 echoed words per
      # audio hour over a day means the vocabulary is poisoning transcripts.
      - alert: AsrPromptEchoRate
        expr: |
          increase(mdx_asr_prompt_echo_words_total[24h])
            /
          (increase(mdx_asr_audio_duration_seconds_sum[24h]) / 3600) > 20
        for: 1h
        labels:
          severity: warn
          team: asr
        annotations:
          summary: "More than 20 prompt-echo words per audio hour over 24h"
          description: |
            The prompt-echo guard removed {{ $value | printf "%.0f" }} words per
            hour of audio in the last day. Check the workspace glossaries
            (`scripts/admin/glossary_audit.py`), the backend and
            `MDX_ASR_CONDITION_PREV`. Runbook: docs/runbooks/asr-worker.md#prompt-echo

      # Speech that reached the file but not the transcript (`no_audio` is the
      # clients' capture latency and is excluded).
      - alert: AsrUncoveredSpeech
        expr: |
          sum(increase(mdx_asr_uncovered_speech_ms_total{cause!="no_audio"}[1h]))
            /
          sum(increase(mdx_asr_speech_ms_total[1h])) > 0.05
        for: 15m
        labels:
          severity: warn
          team: asr
        annotations:
          summary: "More than 5% of speech left untranscribed over 1h"
          description: |
            {{ $value | humanizePercentage }} of the speech VAD heard in the last
            hour has no transcript. Look at mdx_asr_uncovered_speech_ms_total by
            cause and mdx_asr_second_pass_total. Runbook: docs/runbooks/asr-worker.md#coverage

      # Spelling unifier failing: the transcript is still served, names stop being unified.
      - alert: AsrEntityUnifyErrors
        expr: |
          sum(increase(mdx_asr_entity_unify_total{outcome="error"}[1h]))
            /
          sum(increase(mdx_asr_entity_unify_total[1h])) > 0.05
        for: 15m
        labels:
          severity: warn
          team: asr
        annotations:
          summary: "More than 5% of spelling-unifier runs failed over 1h"
          description: |
            {{ $value | humanizePercentage }} of entity_unify runs in the last hour
            ended in error; those transcripts show their raw spellings. Look at
            asr.entity_unify_failed in the asr-service logs (error class only).
            Runbook: docs/runbooks/asr-worker.md#entity-unify
