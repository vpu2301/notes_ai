# promtool unit tests for the viral-loop alerts.
# Run: make check-alert-rules

rule_files:
  - ../viral-loop.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: shared page rate limit storm
    input_series:
      # 600 refusals a minute = 10/s, well over the 5/s line.
      - series: 'mdx_shared_rate_limit_total{scope="ip"}'
        values: "0+600x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: SharedPageRateLimitHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: SharedPageRateLimitHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
            exp_annotations:
              summary: "More than 5 rate-limited /v1/shared requests per second for 5 minutes"
              runbook: "docs/runbooks/notes.md#recipient-links-sprint-19"

  - interval: 1m
    name: a handful of refusals stays quiet
    input_series:
      - series: 'mdx_shared_rate_limit_total{scope="ip"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: SharedPageRateLimitHigh
        exp_alerts: []

  - interval: 1h
    name: dispute rate over the line
    input_series:
      # 30 disputes and 70 confirms over the window: 30% > 20%, and the
      # volume clears the clamp_min(20) floor.
      - series: 'mdx_shared_responses_total{kind="dispute"}'
        values: "0+1x200"
      - series: 'mdx_shared_responses_total{kind="confirm"}'
        values: "0+2x200"
    alert_rule_test:
      - eval_time: 170h
        alertname: SharedPageDisputeRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: product
            exp_annotations:
              summary: "Recipients disputed more than 20% of acted-on items over 7 days"
              runbook: "docs/runbooks/notes.md#recipient-responses-sprint-20"

  - interval: 1h
    name: a few disputes on a tiny sample stay quiet
    input_series:
      - series: 'mdx_shared_responses_total{kind="dispute"}'
        values: "0+0x200 1 1 1"
      - series: 'mdx_shared_responses_total{kind="confirm"}'
        values: "0+0x200 2 2 2"
    alert_rule_test:
      - eval_time: 203h
        alertname: SharedPageDisputeRateHigh
        exp_alerts: []

  - interval: 1h
    name: abuse reports over a day
    input_series:
      - series: 'mdx_share_abuse_reports_total{reason="spam"}'
        values: "0 1 2 3 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4"
    alert_rule_test:
      - eval_time: 25h
        alertname: SharedPageReportsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: product
            exp_annotations:
              summary: "More than 3 shared-page abuse reports in 24 hours"
              runbook: "docs/runbooks/external-sharing.md#abuse-reports"

  - interval: 1m
    name: a quiet day of otp requests stays quiet
    input_series:
      - series: 'mdx_share_otp_requests_total'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: SharedPageOtpBurst
        exp_alerts: []
