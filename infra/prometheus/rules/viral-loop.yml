groups:
  - name: viral-loop
    interval: 1m
    rules:
      # Sustained 429s: a scraper, or a proxy collapsing every reader into one IP bucket.
      - alert: SharedPageRateLimitHigh
        expr: sum(rate(mdx_shared_rate_limit_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "More than 5 rate-limited /v1/shared requests per second for 5 minutes"
          runbook: "docs/runbooks/notes.md#recipient-links-sprint-19"

      # Kill signal: recipients disputing more than a fifth of what they act on.
      - alert: SharedPageDisputeRateHigh
        expr: |
          (sum(increase(mdx_shared_responses_total{kind="dispute"}[7d]))
           / clamp_min(sum(increase(mdx_shared_responses_total[7d])), 20))
          > 0.2
        for: 1h
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Recipients disputed more than 20% of acted-on items over 7 days"
          runbook: "docs/runbooks/notes.md#recipient-responses-sprint-20"

      # More than three abuse reports in a day: a person looks at it today.
      - alert: SharedPageReportsHigh
        expr: sum(increase(mdx_share_abuse_reports_total[24h])) > 3
        for: 10m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "More than 3 shared-page abuse reports in 24 hours"
          runbook: "docs/runbooks/external-sharing.md#abuse-reports"

      # A burst of verification codes: the page used as a mail relay, or a broken client.
      - alert: SharedPageOtpBurst
        expr: sum(rate(mdx_share_otp_requests_total[10m])) * 600 > 100
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "More than 100 recipient verification codes requested in 10 minutes"
          runbook: "docs/runbooks/external-sharing.md#verification-codes"
