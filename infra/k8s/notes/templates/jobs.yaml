{{- /*
One-shot jobs. migrate runs as a Helm hook before every install/upgrade
(the compose `migrate` counterpart); seed is staging-only.
*/ -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mdx-migrate-{{ .Release.Revision }}
  annotations:
    # POST-install: on a virgin cluster postgres itself is a chart
    # resource, so a pre-install migrate would deadlock waiting for a DB
    # that will only exist after install. Services tolerate the gap —
    # readiness holds them out of rotation until migrations land.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app: mdx-migrate, mdx-tier: job}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.stateful.inCluster }}
      initContainers:
        # Belt-and-braces bootstrap: initdb.d scripts run only on an EMPTY
        # data dir, so a container restart mid-first-boot leaves init.sql
        # half-applied (found live in S16D staging: plain-postgres image
        # aborted at CREATE EXTENSION vector and the audit schema never
        # materialised). init.sql is idempotent — re-applying here makes
        # the migrate hook self-healing regardless of first-boot history.
        - name: bootstrap-sql
          image: {{ include "notes.image" (dict "root" $ "image" .Values.jobs.migrate.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h postgres -U postgres; do sleep 2; done
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U postgres \
                -d notes -v ON_ERROR_STOP=1 -f /init/init.sql
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mdx-postgres, key: password}}
          volumeMounts:
            - {name: initdb, mountPath: /init, readOnly: true}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "notes.image" (dict "root" $ "image" .Values.jobs.migrate.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "scripts/db/migrate.py", "up"]
          env:
            - name: DATABASE_URL
              value: {{ .Values.jobs.migrate.databaseUrl | quote }}
      {{- if .Values.stateful.inCluster }}
      volumes:
        - name: initdb
          configMap: {name: mdx-postgres-init}
      {{- end }}
{{- if .Values.jobs.seed.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mdx-seed-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app: mdx-seed, mdx-tier: job}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: {{ include "notes.image" (dict "root" $ "image" .Values.jobs.seed.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Same sequence as the compose seed one-shot (docker-compose.override.yml).
          command:
            - /bin/sh
            - -ec
            - |
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/seed/dev_role_logins.sql
              python scripts/seed/seed.py
          env:
            - name: DATABASE_URL
              value: {{ .Values.jobs.migrate.databaseUrl | quote }}
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: notes
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mdx-postgres, key: password}}
{{- end }}
