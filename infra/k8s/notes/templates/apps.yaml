{{- /*
One Deployment (+ Service) per entry in .Values.apps. Special powers are
value-driven: gpu (node pool + toleration), tmpfs (per-pod RAM emptyDir),
drain (preStop hook + long grace), masterKey mount, workerId
(unique-per-pod env via the downward API), probes/service opt-outs for
queue consumers, command (a worker sharing another app's image).
*/ -}}
{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "notes.labels" $ | nindent 4 }}
spec:
  replicas: {{ $app.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        mdx-tier: app
        {{- range $k, $v := $app.podLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      {{- if $app.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $app.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if $app.gpu }}
      # GPU pool is tainted; one worker per GPU via the device plugin.
      nodeSelector:
        mdx-pool: gpu
      tolerations:
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # NO fsGroup: it turns the 0400 master key into 0440, which
        # FileMasterKeyProvider refuses (fail-closed).
      {{- if $app.masterKey }}
      initContainers:
        # Secret mounts cannot produce a 65532-owned 0400 file; a root init
        # copies the key into an emptyDir with the owner/mode the provider demands.
        - name: fix-master-key-perms
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - /bin/sh
            - -ec
            - |
              cp /secret-src/master.key /etc/mdx/master.key
              chown 65532:65532 /etc/mdx/master.key
              chmod 0400 /etc/mdx/master.key
          volumeMounts:
            - {name: master-key-src, mountPath: /secret-src, readOnly: true}
            - {name: master-key-dir, mountPath: /etc/mdx}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "notes.image" (dict "root" $ "image" $app.image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- if $app.command }}
          command:{{ toYaml $app.command | nindent 12 }}
          {{- end }}
          {{- if or (not (hasKey $app "service")) $app.service }}
          ports:
            - containerPort: 8000
              name: http
          {{- end }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.global.otlpEndpoint | quote }}
            {{- range $k, $v := $.Values.commonEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $app.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if $app.workerId }}
            # Unique per pod.
            - name: {{ $app.workerIdEnv | default "MDX_WORKER_ID" }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          {{- if $app.secretEnv }}
          envFrom:
            {{- range $app.secretEnv }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if or (not (hasKey $app "probes")) $app.probes }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            # Model warmup can take minutes on cold pools.
            failureThreshold: 60
          {{- end }}
          {{- if $app.drain }}
          lifecycle:
            preStop:
              exec:
                # Drain: stop admitting, then hold the pod until the last live
                # session ends (cap = grace period).
                command:
                  - python
                  - -c
                  - |
                    import json, time, urllib.request
                    urllib.request.urlopen(urllib.request.Request(
                        "http://127.0.0.1:8000/internal/drain", method="POST"), timeout=5)
                    while json.load(urllib.request.urlopen(
                            "http://127.0.0.1:8000/internal/drain", timeout=5))["active_sessions"] > 0:
                        time.sleep(5)
          {{- end }}
          resources:
            {{- toYaml ($app.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi"))) | nindent 12 }}
          volumeMounts:
            {{- if $app.tmpfs }}
            - name: session-tmpfs
              mountPath: {{ $app.tmpfs.path }}
            {{- end }}
            {{- if $app.masterKey }}
            - name: master-key-dir
              mountPath: /etc/mdx/master.key
              subPath: master.key
              readOnly: true
            {{- end }}
      volumes:
        {{- if $app.tmpfs }}
        # Per-pod RAM-backed mount; sizeLimit is enforced by the kubelet.
        - name: session-tmpfs
          emptyDir:
            medium: Memory
            sizeLimit: {{ $app.tmpfs.size }}
        {{- end }}
        {{- if $app.masterKey }}
        - name: master-key-src
          secret:
            secretName: {{ $.Values.secretRefs.masterKey }}
            defaultMode: 0400
        - name: master-key-dir
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
{{- if or (not (hasKey $app "service")) $app.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "notes.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: 8000
      targetPort: http
      name: http
{{- end }}
{{- end }}
