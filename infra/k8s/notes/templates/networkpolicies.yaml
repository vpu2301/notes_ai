{{- /*
Default-deny ingress for the whole namespace, then narrow allows:

- app pods accept traffic only from OTHER pods in this namespace
  (service-to-service calls) — never from outside the namespace;
- stateful stores accept only from app/job pods in-namespace.

Nothing in this namespace is reachable from the internet; public
exposure is the ingress/LB layer's concern (hosting choice).
*/ -}}
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-from-namespace
spec:
  podSelector:
    matchLabels: {mdx-tier: app}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Same-namespace traffic only. namespaceSelector on the standard
        # metadata.name label rather than a bare podSelector — identical
        # semantics, and it also matches source pods whose labels the
        # policy controller hasn't indexed (job pods, kubectl-run debug).
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": {{ .Release.Namespace | quote }}}
      ports:
        - {port: 8000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stateful-from-namespace
spec:
  podSelector:
    matchLabels: {mdx-tier: stateful}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": {{ .Release.Namespace | quote }}}
{{- end }}
{{- if and .Values.networkPolicies.enabled .Values.networkPolicies.egress.enabled }}
---
# Worker egress allowlist (DEP-S1-04). Pods labelled mdx-egress: models may
# reach: DNS, in-namespace stateful stores (Postgres/Redis), the
# in-cluster OTel collector, and the model-endpoint CIDRs listed in values —
# nothing else. A prompt injection that tries to exfiltrate to an arbitrary
# host is stopped at the CNI. Hostname-based rules need a CNI that supports
# FQDN policies (Cilium); until the hosting decision (docs/deploy/hosting-gap.md)
# the allowlist is CIDR-based and refreshed by scripts/k8s/egress-allowlist.sh.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-egress-allowlist
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      mdx-egress: models
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              mdx-tier: stateful
    - to:
        - podSelector:
            matchLabels:
              mdx-tier: observability
    {{- range .Values.networkPolicies.egress.allowedCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
{{- end }}

