{{- /*
The nightly-verify ops host-cron (infra/compose/cron/) migrated
in-cluster. The script ships in the chart (files/jobs/) and is
drift-gated against scripts/jobs/ by `make check-k8s-rendered`; it runs
on the note-service image, which carries every lib it imports.
*/ -}}
{{- if .Values.cronJobs.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mdx-ops-jobs
data:
  nightly_verify.py: |
{{ .Files.Get "files/jobs/nightly_verify.py" | indent 4 }}
  weekly_funnel.py: |
{{ .Files.Get "files/jobs/weekly_funnel.py" | indent 4 }}
  loop_funnel.sql: |
{{ .Files.Get "files/jobs/loop_funnel.sql" | indent 4 }}
  share_retention.py: |
{{ .Files.Get "files/jobs/share_retention.py" | indent 4 }}
  ai_retention.py: |
{{ .Files.Get "files/jobs/ai_retention.py" | indent 4 }}
  weekly_speakers.py: |
{{ .Files.Get "files/jobs/weekly_speakers.py" | indent 4 }}
  speaker_quality.sql: |
{{ .Files.Get "files/jobs/speaker_quality.sql" | indent 4 }}
  weekly_notes_quality.py: |
{{ .Files.Get "files/jobs/weekly_notes_quality.py" | indent 4 }}
  notes_quality.sql: |
{{ .Files.Get "files/jobs/notes_quality.sql" | indent 4 }}
{{- $cron := .Values.cronJobs }}
{{- range $job := list
      (dict "name" "nightly-verify" "script" "nightly_verify.py" "schedule" $cron.nightlyVerify.schedule "databaseUrl" $cron.nightlyVerify.databaseUrl)
      (dict "name" "weekly-funnel" "script" "weekly_funnel.py" "schedule" $cron.weeklyFunnel.schedule "databaseUrl" $cron.weeklyFunnel.databaseUrl)
      (dict "name" "share-retention" "script" "share_retention.py" "schedule" $cron.shareRetention.schedule "databaseUrl" $cron.shareRetention.databaseUrl)
      (dict "name" "ai-retention" "script" "ai_retention.py" "schedule" $cron.aiRetention.schedule "databaseUrl" $cron.aiRetention.databaseUrl)
      (dict "name" "weekly-speakers" "script" "weekly_speakers.py" "schedule" $cron.weeklySpeakers.schedule "databaseUrl" $cron.weeklySpeakers.databaseUrl)
      (dict "name" "weekly-notes" "script" "weekly_notes_quality.py" "schedule" $cron.weeklyNotes.schedule "databaseUrl" $cron.weeklyNotes.databaseUrl) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mdx-{{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {app: mdx-{{ $job.name }}, mdx-tier: job}
        spec:
          restartPolicy: Never
          initContainers:
            # Same owner/mode fix as apps.yaml — see the comment there.
            - name: fix-master-key-perms
              image: busybox:1.36
              securityContext: {runAsUser: 0, runAsNonRoot: false}
              command:
                - /bin/sh
                - -ec
                - |
                  cp /secret-src/master.key /etc/mdx/master.key
                  chown 65532:65532 /etc/mdx/master.key
                  chmod 0400 /etc/mdx/master.key
              volumeMounts:
                - {name: master-key-src, mountPath: /secret-src, readOnly: true}
                - {name: master-key-dir, mountPath: /etc/mdx}
          containers:
            - name: job
              image: {{ include "notes.image" (dict "root" $ "image" $cron.image) }}
              imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
              command: ["python", "/ops/{{ $job.script }}"]
              env:
                - name: DATABASE_URL
                  value: {{ $job.databaseUrl | quote }}
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: {{ $.Values.global.otlpEndpoint | quote }}
                {{- range $k, $v := $.Values.commonEnv }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
                - name: S3_ENDPOINT
                  value: {{ $.Values.global.s3Endpoint | quote }}
                - name: MDX_MASTER_KEY_PATH
                  value: /etc/mdx/master.key
              volumeMounts:
                - name: ops-jobs
                  mountPath: /ops
                  readOnly: true
                - name: master-key-dir
                  mountPath: /etc/mdx/master.key
                  subPath: master.key
                  readOnly: true
          volumes:
            - name: ops-jobs
              configMap: {name: mdx-ops-jobs}
            - name: master-key-src
              secret:
                secretName: {{ $.Values.secretRefs.masterKey }}
                defaultMode: 0400
            - name: master-key-dir
              emptyDir: {medium: Memory, sizeLimit: 1Mi}
{{- end }}
{{- end }}
