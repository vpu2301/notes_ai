# STAGING defaults (k3d, CPU-only); production overrides live in values-prod.yaml.

global:
  environment: staging
  imageRegistry: ""            # staging: local images imported into k3d
  imagePullPolicy: IfNotPresent
  otlpEndpoint: http://otel-collector:4317
  # Empty = no object store; set this and every S3_ENDPOINT below together.
  s3Endpoint: ""

# Stateful stores: in-cluster single replicas here; prod sets inCluster=false.
stateful:
  inCluster: true
  postgres:
    # Must be a pgvector build: init.sql runs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg16
    storage: 10Gi
    host: postgres
  redis:
    image: redis:7.2-alpine
    host: redis
  minio:
    image: quay.io/minio/minio:RELEASE.2024-04-18T19-09-19Z
    mcImage: quay.io/minio/mc:RELEASE.2024-04-18T16-45-29Z
    storage: 20Gi
    host: minio
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    host: keycloak
  mailpit:
    enabled: true
    image: axllent/mailpit:v1.20
  llamaServer:
    # Layer C backend; off in staging (generation-service answers 204).
    enabled: false
    image: ghcr.io/ggml-org/llama.cpp:server

observability:
  # Minimal collector + Prometheus (KEDA needs it); prod uses kube-prometheus-stack.
  otelCollector:
    enabled: true
    image: otel/opentelemetry-collector-contrib:0.100.0
  prometheus:
    enabled: true
    image: prom/prometheus:v2.54.1
    host: prometheus

keda:
  # Dictation autoscaling on the weighted-capacity metric (KEDA installed cluster-wide).
  enabled: false               # staging flips true once KEDA is installed
  prometheusAddress: http://prometheus.notes-staging:9090
  targetUtilisation: "0.75"
  minReplicas: 1
  maxReplicas: 8
  # Sessions are long-lived; busy pods are protected by the preStop drain.
  scaleDownStabilizationSeconds: 600

networkPolicies:
  # Default-deny + narrow allows. Off in k3d: kube-router enforces the deny
  # but not the allows. MUST be enabled on the production CNI.
  enabled: false
  # Pods labelled mdx-egress=models reach only DNS, in-namespace stores and
  # these CIDRs on :443 (scripts/k8s/egress-allowlist.sh). The in-process
  # diarizer needs no entry; `make test-egress` asserts the hub stays unreachable.
  egress:
    enabled: false
    allowedCidrs: []

externalSecrets:
  # prod only (ESO → Vault); staging uses plain Secrets from staging-up.sh.
  enabled: false
  secretStore: mdx-vault
  vaultPath: mdx

# Secret names only. NEVER inline secret VALUES in values files.
secretRefs:
  keycloakClients: mdx-keycloak-clients   # KEYCLOAK_LOGIN/ADMIN_CLIENT_SECRET
  masterKey: mdx-master-key               # /etc/mdx/master.key
  hfEndpoints: mdx-hf-endpoints           # HF_CHAT_ENDPOINT_URL, HF_ASR_ENDPOINT_URL, HF_DIAR_ENDPOINT_URL, HF_TOKEN, HF_*_MODEL_PIN (DEP-S1, ADR-0052)

# Shared environment (mirrors the compose x-anchors)
commonEnv:
  ENVIRONMENT: staging
  LOG_LEVEL: INFO
  AUTH_ISSUER: http://keycloak:8080/realms/notes
  AUTH_JWKS_URL: http://keycloak:8080/realms/notes/protocol/openid-connect/certs
  # Both issuers trusted for the dual period (ADR-0047); an empty JWKS only
  # rejects its own tokens.
  AUTH_ISSUERS_JSON: |-
    [{"issuer":"http://keycloak:8080/realms/notes",
      "jwks_url":"http://keycloak:8080/realms/notes/protocol/openid-connect/certs",
      "audience":"mdx-api"},
     {"issuer":"http://auth-service:8000",
      "jwks_url":"http://auth-service:8000/.well-known/jwks.json",
      "audience":"mdx-api"}]
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,https://vpu2301.github.io
  DB_APP_ROLE_DSN: postgresql://app_role:app_role@postgres:5432/notes
  DB_AUDIT_WRITER_DSN: postgresql://audit_writer:audit_writer@postgres:5432/notes

# Application services: one entry per compose service, rendered as a
# Deployment + Service (port 8000). Resources come from measured envelopes.
apps:
  auth-service:
    image: notes-ai-auth-service:latest
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    env:
      DB_TENANT_WRITER_DSN: postgresql://tenant_writer:tenant_writer@postgres:5432/notes
      DB_AUDIT_READER_DSN: postgresql://audit_reader:audit_reader@postgres:5432/notes
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: notes
      REDIS_URL: redis://redis:6379/0
    secretEnv: [mdx-keycloak-clients]
    hpa: {enabled: false, minReplicas: 2, maxReplicas: 6, cpuUtilisation: 70}

  asr-service:
    image: notes-ai-asr-service:latest
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 192Mi}
      limits: {cpu: "1", memory: 768Mi}
    env:
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ""
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      MD_ASR_NLP_BASE_URL: http://nlp-service:8000
    masterKey: true

  asr-worker:
    image: notes-ai-asr-worker:latest
    replicas: 1
    service: false             # Redis-stream consumer — no HTTP surface
    probes: false
    gpu: false                 # prod: true (values-prod.yaml)
    resources:
      requests: {cpu: 500m, memory: 3Gi}
      limits: {cpu: "4", memory: 5Gi}
    env:
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ""
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      MD_ASR_DEVICE: cpu
      MD_ASR_COMPUTE_TYPE: int8
      MD_ASR_MAX_INFERENCE_SECONDS_MULTIPLIER: "52.0"  # F1: 40 × 1.3 for the second pass
      # libs/models registry; staging-up.sh flips ASR_BACKEND to hf_eu_asr
      # when the HF endpoint secret is present.
      ENV: staging
      MODELS_CONFIG: /app/config/models.yaml
      ASR_BACKEND: inproc_cpu_asr
    # HF_* endpoint values, created out of band. MDX_DIAR_ENGINE=http uses the
    # diarization endpoint; `legacy` is the rollback (ADR-0052).
    secretEnv: [mdx-hf-endpoints]
    masterKey: true
    podLabels:
      mdx-egress: models   # subject to workers-egress-allowlist (networkpolicies.yaml)

  dictation-service:
    image: notes-ai-dictation-service:latest
    replicas: 1
    gpu: false                 # prod: true — one pod per GPU (device plugin)
    # preStop drains up to 30 min; the autoscaler can NEVER kill a busy pod.
    drain: true
    terminationGracePeriodSeconds: 1830
    # Per-pod RAM-backed mount for the session rings.
    tmpfs:
      path: /run/dictation
      size: 2Gi
    resources:
      requests: {cpu: 500m, memory: 3Gi}
      limits: {cpu: "4", memory: 5Gi}
    env:
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ""
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      MDX_TMPFS_ROOT: /run/dictation
      MD_ASR_DEVICE: cpu
      MD_ASR_COMPUTE_TYPE: int8
      MDX_CONVERSATION_ENABLED: "false"   # staging CPU; prod: true on GPU
      MDX_WS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:4173","http://127.0.0.1:4173","http://localhost:3000","https://vpu2301.github.io"]'
      MDX_NLP_BASE_URL: http://nlp-service:8000
      MDX_NOTE_BASE_URL: http://note-service:8000
    masterKey: true
    # workerId: true maps MDX_WORKER_ID from metadata.name (unique per pod).
    workerId: true

  nlp-service:
    image: notes-ai-nlp-service:latest
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    env:
      REDIS_URL: redis://redis:6379/0
    hpa: {enabled: false, minReplicas: 2, maxReplicas: 6, cpuUtilisation: 70}

  note-service:
    image: notes-ai-note-service:latest
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 192Mi}
      limits: {cpu: "1", memory: 768Mi}
    env:
      ASR_SERVICE_BASE_URL: http://asr-service:8000
      REDIS_URL: redis://redis:6379/0
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      S3_ENDPOINT: ""
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      # Model registry for "Ask this note"; resolved on first question, so a
      # missing chat endpoint is a 503 model_not_configured, not a boot failure.
      ENV: staging
      MODELS_CONFIG: /app/config/models.yaml
    secretEnv: [mdx-hf-endpoints]
    # NOT labelled mdx-egress=models: note-service must also reach asr-service
    # and calendar feeds (open question: move the ask path into a worker).
    masterKey: true

  # note-worker drains the note.generate queue (ADR-0058); without it notes
  # stay `queued`. env mirrors note-service because the worker calls the API's
  # own build_state(); keep the two blocks in step.
  note-worker:
    image: notes-ai-note-service:latest
    command: ["python", "-m", "note_service.worker"]
    replicas: 1
    service: false             # queue consumer — no HTTP surface
    probes: false
    resources:
      requests: {cpu: 200m, memory: 384Mi}
      limits: {cpu: "2", memory: 1Gi}
    env:
      ASR_SERVICE_BASE_URL: http://asr-service:8000
      REDIS_URL: redis://redis:6379/0
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      S3_ENDPOINT: ""
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      ENV: staging
      MODELS_CONFIG: /app/config/models.yaml
      # Staging only (ADR-0060); prod stays off until precision >= 0.9.
      MDX_NOTE_ENTITY_MODEL_TIER: "true"
    secretEnv: [mdx-hf-endpoints]
    masterKey: true
    podLabels:
      mdx-egress: models   # the chat backend it calls (workers-egress-allowlist)

  autocomplete-service:
    image: notes-ai-autocomplete-service:latest
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 160Mi}
      limits: {cpu: "1", memory: 512Mi}
    env:
      REDIS_URL: redis://redis:6379/0

  generation-service:
    image: notes-ai-generation-service:latest
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    env:
      REDIS_URL: redis://redis:6379/0
      MDX_LAYER_C_ENABLED: "false"   # staging: no llama backend in-cluster
      MDX_GEN_BACKEND: llamacpp
      MDX_GEN_BASE_URL: http://llama-server:8080
      MDX_GEN_MODEL: gemma3:1b

  notification-service:
    image: notes-ai-notification-service:latest
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    env:
      REDIS_URL: redis://redis:6379/0
      MDX_APP_BASE_URL: http://localhost:5173
      MDX_EMAIL_PROVIDER: smtp
      MDX_SMTP_HOST: mailpit
      MDX_SMTP_PORT: "1025"
      MDX_EMAIL_FROM: noreply@notes-ai.local
    # Consumer name must be unique per replica (pending-entries lists).
    workerId: true
    workerIdEnv: MDX_NOTIFICATION_CONSUMER_NAME

# One-shot jobs & CronJobs
jobs:
  migrate:
    image: notes-ai-migrate:latest
    databaseUrl: postgresql://postgres:postgres@postgres:5432/notes
  seed:
    enabled: true                # staging only — prod NEVER seeds dev users
    image: notes-ai-seed:latest

cronJobs:
  enabled: true
  # Scripts ship in files/jobs/ (drift-gated against scripts/jobs/) and run
  # on the note-service image, which carries every lib they import.
  image: notes-ai-note-service:latest
  nightlyVerify:
    schedule: "0 2 * * *"
    databaseUrl: postgresql://postgres:postgres@postgres:5432/notes
  # Weekly loop-funnel CSV, read-only role.
  weeklyFunnel:
    schedule: "15 6 * * 1"
    databaseUrl: postgresql://funnel_reader:funnel_reader@postgres:5432/notes
  # Nightly retention on expired recipient links.
  shareRetention:
    schedule: "30 2 * * *"
    databaseUrl: postgresql://app_role:app_role@postgres:5432/notes
  # AI row retention; runs as tenant_writer because app_role cannot delete.
  aiRetention:
    schedule: "45 2 * * *"
    databaseUrl: postgresql://tenant_writer:tenant_writer@postgres:5432/notes
  # Weekly speaker-quality CSV, read-only role (column-level grant).
  weeklySpeakers:
    schedule: "30 6 * * 1"
    databaseUrl: postgresql://funnel_reader:funnel_reader@postgres:5432/notes
  # Weekly kept-line / dismiss / regenerate / share rates.
  weeklyNotes:
    schedule: "45 6 * * 1"
    databaseUrl: postgresql://funnel_reader:funnel_reader@postgres:5432/notes
