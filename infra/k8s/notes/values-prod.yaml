# PRODUCTION overrides; hosting is still open, so CI renders and gates this
# file before any cluster exists.

global:
  environment: production
  imageRegistry: registry.notes.internal/notes   # registry close to the cluster

stateful:
  # Operator-managed / external stores.
  inCluster: false

observability:
  # kube-prometheus-stack owns prod metrics.
  otelCollector: {enabled: true, image: otel/opentelemetry-collector-contrib:0.100.0}
  prometheus: {enabled: false}

keda:
  enabled: true
  prometheusAddress: http://prometheus-operated.monitoring:9090
  targetUtilisation: "0.75"
  minReplicas: 2
  maxReplicas: 12
  scaleDownStabilizationSeconds: 600

externalSecrets:
  enabled: true
  secretStore: mdx-vault
  vaultPath: mdx

commonEnv:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  AUTH_ISSUER: http://keycloak:8080/realms/notes
  AUTH_JWKS_URL: http://keycloak:8080/realms/notes/protocol/openid-connect/certs
  CORS_ALLOWED_ORIGINS: https://app.notes.example.invalid   # REPLACE with the SPA origin
  DB_APP_ROLE_DSN: postgresql://app_role@postgres:5432/notes
  DB_AUDIT_WRITER_DSN: postgresql://audit_writer@postgres:5432/notes
  # Backend hardening, ON in production
  MDX_REQUIRE_MFA: "true"
  MDX_MFA_ENROLMENT_ENABLED: "true"
  MDX_SESSION_REVOCATION_ENABLED: "true"
  MDX_MASTER_KEY_PROVIDER: vault
  MDX_VAULT_ADDR: http://vault.vault:8200
  MDX_BACKGROUND_JOBS: "true"
  MDX_TELEMETRY_COLD_ARCHIVE_ENABLED: "true"
  MDX_WARM_IN_BACKGROUND: "true"
  MDX_PREWARM_ENABLED: "true"

apps:
  note-worker:
    env:
      # Off until model_tier_precision >= 0.9 (ADR-0060).
      MDX_NOTE_ENTITY_MODEL_TIER: "false"
  auth-service:
    replicas: 2
    hpa: {enabled: true, minReplicas: 2, maxReplicas: 6, cpuUtilisation: 70}
  nlp-service:
    replicas: 2
    hpa: {enabled: true, minReplicas: 2, maxReplicas: 6, cpuUtilisation: 70}
  asr-worker:
    gpu: true
    replicas: 2
    resources:
      requests: {cpu: "2", memory: 6Gi, nvidia.com/gpu: 1}
      limits: {cpu: "6", memory: 10Gi, nvidia.com/gpu: 1}
    env:
      MD_ASR_DEVICE: cuda
      MD_ASR_COMPUTE_TYPE: float16
      # Baked model dir; NEVER a bare HF id in offline images.
      MD_ASR_MODEL: /opt/models/whisper-large-v3
  dictation-service:
    gpu: true
    replicas: 2
    resources:
      # One worker pod per GPU.
      requests: {cpu: "2", memory: 6Gi, nvidia.com/gpu: 1}
      limits: {cpu: "6", memory: 10Gi, nvidia.com/gpu: 1}
    env:
      MD_ASR_DEVICE: cuda
      MD_ASR_COMPUTE_TYPE: float16
      MD_ASR_MODEL: /opt/models/whisper-large-v3
      MDX_CONVERSATION_ENABLED: "true"
      MDX_DIAR_WARM_AT_STARTUP: "true"
  generation-service:
    env:
      MDX_LAYER_C_ENABLED: "true"
      MDX_GEN_BASE_URL: http://llama-server:8080

jobs:
  migrate:
    databaseUrl: postgresql://postgres@postgres:5432/notes
  seed:
    enabled: false   # production NEVER seeds dev tenants/users

stateful_llama:   # documented: Layer C backend runs on the GPU pool
  enabled: true
