# GPU overlay: CUDA variants of the ASR workers. Needs NVIDIA driver >= 535,
# CUDA 12.x and the NVIDIA Container Toolkit as a Docker runtime.
#   docker compose -f infra/compose/base.yml -f infra/compose/dev.yml -f infra/compose/gpu.yml up -d
name: notes-ai

services:
  asr-worker:
    build:
      context: ../..
      dockerfile: services/asr-worker/Dockerfile
      # The pyannote stage fetches a GATED model at build time: BuildKit
      # secret only (never ARG/ENV); export HF_TOKEN first or the build fails closed.
      secrets:
        - hf_token
    runtime: nvidia
    environment:
      MD_ASR_DEVICE: cuda
      # Baked weights; NEVER a bare HF id (it would resolve over the network).
      MD_ASR_MODEL: /opt/models/whisper-large-v3
      MD_ASR_COMPUTE_TYPE: float16
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  dictation-service:
    build:
      context: ../..
      dockerfile: services/dictation-service/Dockerfile
    runtime: nvidia
    environment:
      MD_ASR_DEVICE: cuda
      # Baked weights; NEVER a bare HF id (it would resolve over the network).
      MD_ASR_MODEL: /opt/models/whisper-large-v3
      MD_ASR_COMPUTE_TYPE: float16
      # ECAPA shares the GPU; model dir and digests come from the image ENV.
      MDX_DIAR_DEVICE: cuda
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

secrets:
  hf_token:
    environment: HF_TOKEN
