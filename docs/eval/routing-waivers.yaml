# Routing waivers (Sprint SQ1 T6, scripts/ci/check-routing-has-report.py).
#
# A backend that config/models.yaml routes a chat operation to must have a
# notes report on eval/notes/v2 at the current PROMPT_VERSION — or a waiver
# here for that exact (backend, prompt_version), with the reason, an owner
# and an expiry date. A routing change or a prompt bump without one fails CI.
# A waiver is a recorded exception, not a substitute: it says the number is
# missing and why.
waivers:
  - backend: hf_eu
    prompt_version: "2026-10-01"
    reason: >-
      Staging routes Gemma 3 4B (hf_eu) as before SQ1. There is no eval/notes/v2
      report: the owner decided on 2026-10-01 not to label a gold set and to judge
      notes on real recordings instead (ADR-0068). The only numbers are the
      synthetic m01–m11 runs.
    owner: founder
    expires: 2026-12-31
  - backend: hf_eu
    prompt_version: "2026-10-01.2"
    reason: >-
      Sprint SQ2 bumped the prompt version (the coverage variant of extraction).
      Staging still routes hf_eu with no eval/notes/v2 report, for the same reason
      as the 2026-10-01 waiver above; SQ2's numbers are synthetic and on the
      hf_eu stand-in (docs/eval/sq2-coverage-2026-10-01.md).
    owner: founder
    expires: 2026-12-31
  - backend: hf_eu
    prompt_version: "2026-10-01.3"
    reason: >-
      Sprint SQ3 changed the title prompt (excerpts from each third plus the
      note's themes and facts). Staging still routes hf_eu with no
      eval/notes/v2 report, for the same reason as the waivers above.
    owner: founder
    expires: 2026-12-31
  - backend: hf_eu
    prompt_version: "2026-10-18.6"
    reason: >-
      Sprint N2 (note instructions) added the FORM block and the heading-range field
      to the compose prompts; with no writing profile the prompt text is unchanged.
      hf_eu cannot be reached from this environment (the HF endpoints were never
      created) and eval/notes/v2 holds no meetings (ADR-0068), so there is no report.
      Waived on 2026-10-19; N2's numbers are synthetic, on mistral_eu.
    owner: founder
    expires: 2026-12-31
  - backend: hf_eu
    prompt_version: "2026-10-19.1"
    reason: >-
      Sprint N0 (writing style) added one line per style (formal, informal, academic) at
      the head of the FORM block; `business`, the default, sends today's prompts. hf_eu is
      not reachable from this environment (the HF endpoints were never created) and
      eval/notes/v2 holds no meetings (ADR-0068). Waived on 2026-10-19; N0's numbers are
      synthetic, on mistral_eu.
    owner: founder
    expires: 2026-12-31
  - backend: hf_eu
    prompt_version: "2026-10-19.2"
    reason: >-
      The concept's revision replaced the instructions' `register` (plain/formal lines)
      with N0's `style`; with no instructions and the business style the prompts are
      unchanged. hf_eu is not reachable from this environment and eval/notes/v2 holds no
      meetings (ADR-0068). Waived on 2026-10-19.
    owner: founder
    expires: 2026-12-31
  - backend: hf_eu
    prompt_version: "2026-10-19.3"
    reason: >-
      Sprint B2: narrated addenda (extract/context/block/summary/title) selected only for
      the broadcast and memo families, the outline step and the certainties reported,
      unproven and refuted; meeting-family prompt strings are byte-identical (golden test
      in tests/unit/test_meeting_doc_b2.py). hf_eu is not reachable from this environment
      and eval/notes/v2 holds no meetings (ADR-0068); the numbers are the synthetic
      m01–m11 runs and the r02 case on mistral_eu (docs/eval/notes-pipeline-2026-10-19-*).
      Waived on 2026-10-19.
    owner: founder
    expires: 2026-12-31
