[project]
name = "telemetry"
version = "0.1.0"
description = "Per-run pipeline telemetry (schema v1): run/span/LLM-call/client-event records, fail-open Postgres store, redaction, runtime context, retention (telemetry sprints)."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "opentelemetry-api>=1.24.0",
    "db",
]

[tool.uv.sources]
db = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # The design JSON Schema check and a real tracer for the propagation test.
    "jsonschema>=4.0",
    "opentelemetry-sdk>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
strict = true
python_version = "3.12"
