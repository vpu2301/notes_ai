[project]
name = "models"
version = "0.1.0"
description = "Model-provider seam (DEP-S0): ChatProvider / ASRProvider / EmbeddingProvider protocols, one OpenAI-compatible HTTP implementation, and the registry that resolves a backend from workspace setting + tier + config/models.yaml. Workers never name a vendor."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "asr_models",
]

[tool.uv.sources]
asr_models = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
markers = [
    "live: talks to a real model server on the developer's Mac (opt-in: pytest -m live)",
]

[tool.mypy]
strict = true
python_version = "3.12"
