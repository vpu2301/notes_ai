    - { text: "Thank you for watching", match: prefix, drop: always }
    - { text: "Thank you so much for watching", match: prefix, drop: always }
    - { text: "Please subscribe to my channel", match: prefix, drop: always }
    - { text: "Don't forget to like and subscribe", match: prefix, drop: always }
    - { text: "Like and subscribe", match: prefix, drop: always }
