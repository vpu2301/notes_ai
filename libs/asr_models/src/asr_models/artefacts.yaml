    - { text: "Субтитри підготувала", match: prefix, drop: always }
    - { text: "Редактор субтитрів", match: prefix, drop: always }
    - { text: "Підписуйтесь на канал", match: prefix, drop: always }
    - { text: "Підписуйтеся на наш канал", match: prefix, drop: always }
    - { text: "Підписуйтесь на наш канал", match: prefix, drop: always }
    - { text: "Ставте лайки", match: prefix, drop: always }
