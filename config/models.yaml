# Model backends and routing: the single place a backend is named; switching
# one is a config PR reviewed like a migration.
# ${VAR} / ${VAR:-default} resolve from the environment at startup; an enabled
# backend with unset variables refuses to start (missing_env). Never commit values here.
version: 1

backends:
  # ── founder's Mac (dev only; refused on staging/prod even by typo) ──────
  dev_mac:
    kind: openai_compat
    base_url: ${DEV_MAC_MODEL_URL:-http://host.docker.internal:11434/v1}
    auth: none
    enabled_in_envs: [dev]
    models: { chat: "${DEV_MAC_CHAT_MODEL:-notes-chat}" }
    structured_output: json_schema
    # 16K is what infra/models/dev-mac/Modelfile bakes.
    context_window: ${DEV_MAC_CONTEXT:-16384}
    max_concurrency: 1
    timeout_seconds: 900
    # The engine gives a small local model simpler work; off for every hosted backend.
    small_model: ${DEV_MAC_SMALL_MODEL:-true}
    # `none` keeps a reasoning family (Qwen3) from spending the budget on <think>; empty = not sent.
    request_overrides: { reasoning_effort: "${DEV_MAC_REASONING_EFFORT:-none}" }
    processor: { name: "Developer machine", region: "local" }

  dev_mac_asr:
    kind: asr_http
    base_url: ${DEV_MAC_ASR_URL:-http://host.docker.internal:8080}
    auth: none
    enabled_in_envs: [dev]
    models: { asr: "${DEV_MAC_ASR_MODEL:-whisper-large-v3-turbo}" }
    timeout_seconds: 3600
    processor: { name: "Developer machine", region: "local" }

  # ── Mistral AI, EU-hosted API: the large model writes, the small one
  # classifies/names/corrects. Ids pinned to a dated version, never `-latest`
  # (docs/models/PINS.md); zero retention is an account setting.
  mistral_eu:
    kind: openai_compat
    base_url: ${MISTRAL_API_URL:-https://api.mistral.ai/v1}
    auth: bearer:${MISTRAL_API_KEY}
    enabled_in_envs: [dev, staging, prod]
    models: { chat: "${MISTRAL_LARGE_PIN:-mistral-large-2512}" }
    structured_output: probe
    context_window: 131072
    max_concurrency: 8
    timeout_seconds: 120
    processor: { name: "Mistral AI", region: "EU" }

  mistral_eu_small:
    kind: openai_compat
    base_url: ${MISTRAL_API_URL:-https://api.mistral.ai/v1}
    auth: bearer:${MISTRAL_API_KEY}
    enabled_in_envs: [dev, staging, prod]
    models: { chat: "${MISTRAL_SMALL_PIN:-mistral-small-2603}" }
    structured_output: probe
    context_window: 131072
    max_concurrency: 8
    timeout_seconds: 60
    processor: { name: "Mistral AI", region: "EU" }

  # ── Hugging Face Inference Endpoints, EU region (beta default) ─────────
  hf_eu:
    kind: openai_compat
    base_url: ${HF_CHAT_ENDPOINT_URL}
    auth: bearer:${HF_TOKEN}
    enabled_in_envs: [staging, prod]
    models: { chat: "${HF_CHAT_MODEL_PIN}" }
    structured_output: probe
    context_window: 32768
    max_concurrency: 4
    cold_start_seconds: 300
    timeout_seconds: 300
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  hf_eu_asr:
    kind: asr_http
    base_url: ${HF_ASR_ENDPOINT_URL}
    auth: bearer:${HF_TOKEN}
    enabled_in_envs: [staging, prod]
    models: { asr: "${HF_ASR_MODEL_PIN}" }
    cold_start_seconds: 240
    timeout_seconds: 1800
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  # ── speaker diarization (ADR-0052): deploy/diar-server on a GPU ────────
  # TWO tokens: the `auth:` bearer for the endpoint gateway, and
  # MDX_DIAR_SERVER_TOKEN (X-MDX-Diar-Token) for the container itself.
  dev_mac_diar:
    kind: diar_http
    base_url: ${DEV_MAC_DIAR_URL:-http://host.docker.internal:8081}
    auth: none
    enabled_in_envs: [dev]
    models: { diarization: "${DEV_MAC_DIAR_MODEL:-pyannote-community-1}" }
    max_concurrency: 1
    timeout_seconds: 1800
    processor: { name: "Developer machine", region: "local" }

  hf_eu_diar:
    kind: diar_http
    base_url: ${HF_DIAR_ENDPOINT_URL}
    auth: bearer:${HF_TOKEN}
    enabled_in_envs: [staging, prod]
    models: { diarization: "${HF_DIAR_MODEL_PIN}" }
    max_concurrency: 2
    cold_start_seconds: 240
    timeout_seconds: 1800
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  # ── ASR bake-off candidates (ADR-0067): enabled on staging for the
  # worker's shadow run; `routing` never names them until the rule adopts one.
  cand_parakeet_asr:          # arm C: nvidia/parakeet-tdt-0.6b-v3 in deploy/asr-server (NeMo, T4)
    kind: asr_http
    base_url: ${CAND_PARAKEET_URL:-}
    auth: bearer:${HF_TOKEN:-}
    server_token: ${CAND_PARAKEET_SERVER_TOKEN:-}
    enabled_in_envs: [dev, test, staging]
    models: { asr: "${CAND_PARAKEET_MODEL_PIN:-nvidia/parakeet-tdt-0.6b-v3}" }
    cold_start_seconds: 300
    timeout_seconds: 1800
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  cand_whisper_v3_asr:        # arm B: whisper-large-v3 (full), Speaches, fp16 T4
    kind: asr_http
    base_url: ${CAND_WHISPER_V3_URL:-}
    auth: bearer:${HF_TOKEN:-}
    enabled_in_envs: [dev, test, staging]
    models: { asr: "${CAND_WHISPER_V3_MODEL_PIN:-Systran/faster-whisper-large-v3}" }
    cold_start_seconds: 300
    timeout_seconds: 1800
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  dev_mac_parakeet_asr:       # arm C on the Mac: deploy/asr-server, ONNX runtime, :8082
    kind: asr_http
    base_url: ${DEV_MAC_PARAKEET_URL:-http://host.docker.internal:8082}
    auth: none
    enabled_in_envs: [dev]
    models: { asr: "parakeet-tdt-0.6b-v3" }
    timeout_seconds: 3600
    processor: { name: "Developer machine", region: "local" }

  # ── chat bake-off candidates: eval only (`enabled_in_envs: [dev, test]`),
  # so no customer workspace can reach them; winning is a routing change.
  cand_gemma_27b:
    kind: openai_compat
    base_url: ${CAND_GEMMA_URL:-}
    auth: bearer:${HF_TOKEN:-}
    enabled_in_envs: [dev, test]
    models: { chat: "${CAND_GEMMA_MODEL:-google/gemma-3-27b-it}" }
    structured_output: probe
    context_window: 65536
    max_concurrency: 2
    cold_start_seconds: 300
    timeout_seconds: 600
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  cand_mistral_small:
    kind: openai_compat
    base_url: ${CAND_MISTRAL_URL:-}
    auth: bearer:${HF_TOKEN:-}
    enabled_in_envs: [dev, test]
    models: { chat: "${CAND_MISTRAL_MODEL:-mistralai/Mistral-Small-3.2-24B-Instruct-2506}" }
    structured_output: probe
    context_window: 65536
    max_concurrency: 2
    cold_start_seconds: 300
    timeout_seconds: 600
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  cand_qwen_32b:
    kind: openai_compat
    base_url: ${CAND_QWEN_URL:-}
    auth: bearer:${HF_TOKEN:-}
    enabled_in_envs: [dev, test]
    models: { chat: "${CAND_QWEN_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}" }
    structured_output: probe
    context_window: 65536
    max_concurrency: 2
    cold_start_seconds: 300
    timeout_seconds: 600
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  cand_gptoss_20b:
    kind: openai_compat
    base_url: ${CAND_GPTOSS_URL:-}
    auth: bearer:${HF_TOKEN:-}
    enabled_in_envs: [dev, test]
    models: { chat: "${CAND_GPTOSS_MODEL:-openai/gpt-oss-20b}" }
    structured_output: probe
    context_window: 65536
    max_concurrency: 2
    cold_start_seconds: 300
    timeout_seconds: 600
    processor: { name: "Hugging Face Inference Endpoints", region: "EU" }

  # The premium candidate: disabled and NAMELESS on purpose (a processor entry
  # is a disclosure the Data page reads); named in the PR that selects it.
  cand_frontier_eu:
    kind: openai_compat
    enabled: false
    base_url: ${CAND_FRONTIER_URL:-}
    auth: bearer:${CAND_FRONTIER_TOKEN:-}
    enabled_in_envs: [dev, test]
    models: { chat: "${CAND_FRONTIER_MODEL:-}" }
    structured_output: json_schema
    context_window: 131072
    max_concurrency: 2
    timeout_seconds: 600
    processor: { name: "Unselected premium candidate", region: "EU" }

  # ── our own EU GPU host (vLLM) — registered, disabled until gate H0 ────
  hosted_eu:
    kind: openai_compat
    enabled: false
    base_url: ${HOSTED_MODEL_URL:-}
    auth: bearer:${HOSTED_MODEL_TOKEN:-}
    enabled_in_envs: [staging, prod]
    models: { chat: "${HOSTED_CHAT_MODEL_PIN:-}" }
    structured_output: guided_json
    context_window: 32768
    max_concurrency: 8
    timeout_seconds: 300
    processor: { name: "Notes AI (own EU host)", region: "EU" }

  # ── opt-in vendor processor (BE-S3); requires Data-page acknowledgement ─
  anthropic:
    kind: anthropic
    enabled: false
    models: { chat: "${ANTHROPIC_MODEL_PIN:-}" }
    processor: { name: "Anthropic", region: "US/EU" }

  # ── in-process faster-whisper (CI, self-host, today's worker) ──────────
  inproc_cpu_asr:
    kind: asr_inproc
    enabled_in_envs: [dev, test, staging, prod]

  # ── test env: cassettes, never the network ─────────────────────────────
  recorded:
    kind: recorded
    enabled_in_envs: [test]
    cassette_dir: ${MODELS_CASSETTE_DIR:-tests/fixtures/eval/cassettes}

# operation -> tier -> backend, as staging/prod run it (dev is overridden below).
routing:
  understand: { standard: hf_eu,     premium: hf_eu }
  summarize:  { standard: hf_eu,     premium: hf_eu }
  classify:   { standard: hf_eu,     premium: hf_eu }
  title:      { standard: hf_eu,     premium: hf_eu }
  entities:   { standard: hf_eu,     premium: hf_eu }
  asr:        { standard: hf_eu_asr, premium: hf_eu_asr }

# Per-environment override of an operation kind (or operation), applied
# before routing. The fallback is taken on missing_env, forced
# (MDX_DEV_CHAT_BACKEND) or probe_failed.
env_overrides:
  dev:
    chat: { primary: mistral_eu, fallback: dev_mac }
    classify: { primary: mistral_eu_small, fallback: dev_mac }
    title: { primary: mistral_eu_small, fallback: dev_mac }
    entities: { primary: mistral_eu_small, fallback: dev_mac }
    asr: dev_mac_asr
    diarization: dev_mac_diar
  test: { chat: recorded, asr: inproc_cpu_asr }
