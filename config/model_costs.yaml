# Cost rates per backend for the model_usage ledger:
# cost_cents_est = input_tokens/1000 * input_cents_per_1k
#                + output_tokens/1000 * output_cents_per_1k
#                + audio_seconds/60 * audio_cents_per_minute
# HF rates = instance hourly price / measured throughput; first estimates from list prices.
version: 1
currency: EUR
backends:
  dev_mac:        { input_cents_per_1k: 0, output_cents_per_1k: 0 }
  dev_mac_asr:    { audio_cents_per_minute: 0 }
  inproc_cpu_asr: { audio_cents_per_minute: 0 }
  recorded:       { input_cents_per_1k: 0, output_cents_per_1k: 0 }
  # nvidia-l4 x1 ≈ €0.75/h; assume 25 tok/s generation + prompt processing amortised
  # → ~90k output tokens/h → 0.83 c per 1k output; prompt tokens ~10× cheaper.
  hf_eu:          { input_cents_per_1k: 0.08, output_cents_per_1k: 0.83, cold_start_cents: 6 }
  # nvidia-t4 x1 ≈ €0.50/h; whisper-large-v3-turbo ≈ 0.05× realtime on T4 → 1200 audio-min/h
  hf_eu_asr:      { audio_cents_per_minute: 0.04, cold_start_cents: 4 }
  # Mistral AI (EU) list prices (2026-09-27), cents per 1k at 1 USD ≈ 1 EUR;
  # cached input (10 %) is not modelled.
  mistral_eu:        { input_cents_per_1k: 0.05, output_cents_per_1k: 0.15 }
  mistral_eu_small:  { input_cents_per_1k: 0.015, output_cents_per_1k: 0.06 }
  # Bake-off candidates, metered like any other ("cheapest candidate that
  # passes every gate" needs numbers).
  cand_gemma_27b:     { input_cents_per_1k: 0.20, output_cents_per_1k: 2.10, cold_start_cents: 8 }
  cand_mistral_small: { input_cents_per_1k: 0.18, output_cents_per_1k: 1.90, cold_start_cents: 8 }
  cand_qwen_32b:      { input_cents_per_1k: 0.22, output_cents_per_1k: 2.30, cold_start_cents: 8 }
  cand_gptoss_20b:    { input_cents_per_1k: 0.15, output_cents_per_1k: 1.60, cold_start_cents: 8 }
  cand_frontier_eu:   { input_cents_per_1k: null, output_cents_per_1k: null }   # at selection
  hosted_eu:      { input_cents_per_1k: null, output_cents_per_1k: null }   # DEP-S6
  anthropic:      { input_cents_per_1k: null, output_cents_per_1k: null }   # BE-S3
