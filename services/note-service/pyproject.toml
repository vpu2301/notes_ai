[project]
name = "note-service"
version = "0.8.0"
description = "Notes core: templates + notes/versions/diff/search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.29.0",
    "cachetools>=5.3.3",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "python-json-logger>=2.0.7",
    # Internal libs
    "observability",
    "auth",
    "audit",
    "db",
    "template_models",
    "note_models",
    "notification_events",
    "redis>=5.0",
    "secret",
    # Audio replay (ADR-0037)
    "crypto",
    "storage",
    # PDF rendering (deterministic export)
    "weasyprint>=62.0",
    "Jinja2>=3.1",
    "pypdf>=4.2",
    # Calendar links (0020): RRULE expansion of iCal feeds
    "python-dateutil>=2.9",
]

[tool.uv.sources]
observability = { workspace = true }
auth = { workspace = true }
audit = { workspace = true }
db = { workspace = true }
template_models = { workspace = true }
note_models = { workspace = true }
notification_events = { workspace = true }
secret = { workspace = true }
crypto = { workspace = true }
storage = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.103",
    "fakeredis>=2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
