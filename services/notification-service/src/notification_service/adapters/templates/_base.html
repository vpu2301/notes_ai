{# Shared shell. Inline styles only — mail clients strip <style>. #}
<!-- Rendered by notification-service. Contains NO note content or personal data by design. -->
<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;color:#1a1a1a;max-width:560px">
  <h2 style="font-size:18px;margin:0 0 12px">{% block heading %}{% endblock %}</h2>
  <p style="margin:0 0 16px;line-height:1.5">{% block body %}{% endblock %}</p>
  {% if deep_link %}
  <p style="margin:0 0 20px">
    <a href="{{ deep_link }}" style="background:#0b5fff;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none;display:inline-block">Open in Klarnote</a>
  </p>
  {% endif %}
  <hr style="border:none;border-top:1px solid #e5e5e5;margin:20px 0">
  <p style="font-size:12px;color:#666;margin:0;line-height:1.5">
    This is an automated message from Klarnote.
    It deliberately contains no note content or personal data — sign in
    to see the details.
    You can adjust these emails under “Notifications” in the app.
  </p>
</div>
