# Full-stack overlay, auto-merged on a plain `docker compose up`
# (`make dev-up` passes -f docker-compose.yml and stays infra-only).
# Host ports: auth 8000, asr 8001, dictation 8002, notification 8004,
# nlp 8005, note 8006, autocomplete 8007, generation 8009, llama 8089.
# Building asr-worker/dictation-service needs network (whisper-tiny weights).
# Docker engine needs >= 12 GiB: on 8 GiB dictation-service OOMs loading the
# diarizer and crash-loops silently (`docker events` shows `die exit=137`).
name: notes-ai

x-postgres-dsns: &postgres-dsns
  DB_APP_ROLE_DSN: postgresql://app_role:app_role@postgres:5432/notes
  DB_AUDIT_WRITER_DSN: postgresql://audit_writer:audit_writer@postgres:5432/notes

x-auth-env: &auth-env
  AUTH_ISSUER: http://keycloak:8080/realms/notes
  AUTH_JWKS_URL: http://keycloak:8080/realms/notes/protocol/openid-connect/certs
  # Both issuers are trusted (ADR-0047); an issuer with no keys only rejects
  # its own tokens. `issuer` is the browser-facing origin (token `iss`);
  # `jwks_url` must be the in-cluster address (localhost = the consumer itself).
  AUTH_ISSUERS_JSON: >-
    [{"issuer":"http://keycloak:8080/realms/notes",
      "jwks_url":"http://keycloak:8080/realms/notes/protocol/openid-connect/certs",
      "audience":"mdx-api"},
     {"issuer":"${AUTH_ISSUER_URL:-http://localhost:8000}",
      "jwks_url":"${AUTH_ISSUER_JWKS_URL:-http://auth-service:8000/.well-known/jwks.json}",
      "audience":"mdx-api"}]

# Credentialed browser origins; every SPA-facing service merges this.
x-cors-env: &cors-env
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,https://vpu2301.github.io

x-common-env: &common-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

# Defaults to the stack's MinIO; an empty S3_ENDPOINT = 503 object_store_not_configured.
x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}

x-svc-healthcheck: &svc-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else sys.exit(1)"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 30s

services:
  # MinIO bucket bootstrap
  minio-init:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"
        mc mb --ignore-existing local/mdx-audio
        mc mb --ignore-existing local/mdx-transcripts
        mc version enable local/mdx-audio || true
        mc version enable local/mdx-transcripts || true
        # Replay clips — 5-min token/registry TTL is the real lifetime;
        # 1-day ILM is the ciphertext backstop (ADR-0037).
        mc mb --ignore-existing local/mdx-audio-clips
        mc ilm rule rm --all --force local/mdx-audio-clips 2>/dev/null || true
        mc ilm rule add --expire-days 1 local/mdx-audio-clips
        echo "minio-init: buckets ready"
    restart: "no"

  # Migrations run as superuser (CREATE ROLE / extensions).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.tools
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notes
    command: ["python", "scripts/db/migrate.py", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile.tools
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notes
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notes
    command:
      - /bin/sh
      - -ec
      - |
        echo "seed: granting dev role logins"
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/seed/dev_role_logins.sql
        echo "seed: dev tenants/users + system templates + starter content"
        python scripts/seed/seed.py
        echo "seed: complete"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *cors-env]
      DB_APP_ROLE_DSN: postgresql://app_role:app_role@postgres:5432/notes
      DB_TENANT_WRITER_DSN: postgresql://tenant_writer:tenant_writer@postgres:5432/notes
      DB_AUDIT_WRITER_DSN: postgresql://audit_writer:audit_writer@postgres:5432/notes
      DB_AUDIT_READER_DSN: postgresql://audit_reader:audit_reader@postgres:5432/notes
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: notes
      MDX_IDP_MODE: "${MDX_IDP_MODE:-keycloak}"
      AUTH_ISSUER_URL: "${AUTH_ISSUER_URL:-http://localhost:8000}"
      AUTH_ACCESS_TTL_SECONDS: "${AUTH_ACCESS_TTL_SECONDS:-900}"
      # Refresh TTL slides on every rotation; the absolute cap does not.
      AUTH_REFRESH_TTL_SECONDS: "${AUTH_REFRESH_TTL_SECONDS:-2592000}"
      AUTH_SESSION_ABSOLUTE_TTL_SECONDS: "${AUTH_SESSION_ABSOLUTE_TTL_SECONDS:-7776000}"
      AUTH_REFRESH_GRACE_SECONDS: "${AUTH_REFRESH_GRACE_SECONDS:-30}"
      AUTH_SIGNING_KEYS_FILE: /etc/mdx/auth-signing.json
      # Mail defaults to Mailpit (http://localhost:8025) so nothing escapes without a .env.
      MDX_PASSWORD_RESET_ENABLED: "${MDX_PASSWORD_RESET_ENABLED:-true}"
      MDX_EMAIL_PROVIDER: "${MDX_EMAIL_PROVIDER:-smtp}"
      MDX_SIGNUP_ENABLED: "${MDX_SIGNUP_ENABLED:-true}"
      MDX_AUTH_SMTP_HOST: "${MDX_AUTH_SMTP_HOST:-mailpit}"
      MDX_AUTH_SMTP_PORT: "${MDX_AUTH_SMTP_PORT:-1025}"
      MDX_AUTH_SMTP_USE_TLS: "${MDX_AUTH_SMTP_USE_TLS:-false}"
      MDX_AUTH_SMTP_USERNAME: "${MDX_AUTH_SMTP_USERNAME:-}"
      MDX_AUTH_SMTP_PASSWORD: "${MDX_AUTH_SMTP_PASSWORD:-}"
      MDX_AUTH_EMAIL_FROM: "${MDX_AUTH_EMAIL_FROM:-sales@notes-ai.local}"
      MDX_AUTH_EMAIL_FROM_NAME: "${MDX_AUTH_EMAIL_FROM_NAME:-Notes AI}"
      MDX_AUTH_EMAIL_REPLY_TO: "${MDX_AUTH_EMAIL_REPLY_TO:-sales@notes-ai.local}"
      # Must be the origin the SPA is served from, or mailed links 404.
      MDX_APP_BASE_URL: "${MDX_APP_BASE_URL:-http://localhost:5173}"
      MDX_SUPPORT_URL: "${MDX_SUPPORT_URL:-https://notes-ai.local/contact}"
      # Known dev salt; MUST be overridden in staging/prod.
      MDX_PASSWORD_RESET_IP_HASH_SALT: "${MDX_PASSWORD_RESET_IP_HASH_SALT:-dev-ip-hash-salt-change-in-prod}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      # Off: the MFA reminder still banners in the SPA; only bell + mail go quiet.
      MDX_NOTIFICATIONS_ENABLED: "${MDX_NOTIFICATIONS_ENABLED:-true}"
      # MFA (ADR-0039): enrolment on, enforcement off; an enrolled user is
      # still asked for the code at login.
      MDX_MFA_ENROLMENT_ENABLED: "${MDX_MFA_ENROLMENT_ENABLED:-true}"
      MDX_REQUIRE_MFA: "${MDX_REQUIRE_MFA:-false}"
      MDX_MFA_TOTP_ISSUER: "${MDX_MFA_TOTP_ISSUER:-Notes AI (dev)}"
      # TOTP secrets are envelope-encrypted: master key + crypto_writer needed.
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
      - ./infra/dev/auth-signing-dev.json:/etc/mdx/auth-signing.json:ro
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:8000:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Redis users here are fail-open; this only avoids a noisy cold start.
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  asr-service:
    build:
      context: .
      dockerfile: services/asr-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env, *s3-env]
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      REDIS_URL: redis://redis:6379/0
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      MD_ASR_NLP_BASE_URL: http://nlp-service:8000
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:8001:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # asr-worker runs large-v3 int8 from the host's HF cache (tiny is unusable
  # for Ukrainian); the inference-budget multiplier is raised for CPU (dev only).
  asr-worker:
    build:
      context: .
      dockerfile: services/asr-worker/Dockerfile.cpu
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-dsns, *s3-env]
      MD_ASR_DEVICE: cpu
      MD_ASR_MODEL: /opt/models/whisper-large-v3/snapshots/edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_COMPUTE_TYPE: int8
      MD_ASR_MODEL_REPO: Systran/faster-whisper-large-v3
      MD_ASR_MODEL_REVISION: edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_MODEL_SHA256: 69f74147e3334731bc3a76048724833325d2ec74642fb52620eda87352e3d4f1
      MD_ASR_MAX_INFERENCE_SECONDS_MULTIPLIER: "52.0"  # F1: 40 × 1.3 for the second pass
      # libs/models registry: dev_mac_asr = whisper-server on this Mac (make dev-model).
      ENV: ${ENV:-dev}
      MODELS_CONFIG: /app/config/models.yaml
      ASR_BACKEND: ${ASR_BACKEND:-inproc_cpu_asr}
      # Parakeet on this Mac (DEV_MAC_ASR_ENGINE=parakeet), primary or shadow.
      DEV_MAC_PARAKEET_URL: ${DEV_MAC_PARAKEET_URL:-http://host.docker.internal:8082}
      MDX_ASR_SHADOW_BACKEND: ${MDX_ASR_SHADOW_BACKEND:-}
      MDX_ASR_SHADOW_RATE: ${MDX_ASR_SHADOW_RATE:-0.2}
      MDX_ASR_SHADOW_BUDGET_HOURS: ${MDX_ASR_SHADOW_BUDGET_HOURS:-4}
      DEV_MAC_ASR_URL: ${DEV_MAC_ASR_URL:-http://host.docker.internal:8080}
      HF_ASR_ENDPOINT_URL: ${HF_ASR_ENDPOINT_URL:-}
      HF_ASR_MODEL_PIN: ${HF_ASR_MODEL_PIN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      REDIS_URL: redis://redis:6379/0
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
      - ${HOME}/.cache/huggingface/hub/models--Systran--faster-whisper-large-v3:/opt/models/whisper-large-v3:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # dictation-service: same large-v3 weights from the host's HF cache.
  dictation-service:
    build:
      context: .
      dockerfile: services/dictation-service/Dockerfile.cpu
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env, *s3-env]
      MD_ASR_DEVICE: cpu
      MD_ASR_MODEL: /opt/models/whisper-large-v3/snapshots/edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_COMPUTE_TYPE: int8
      MD_ASR_MODEL_REPO: Systran/faster-whisper-large-v3
      MD_ASR_MODEL_REVISION: edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_MODEL_SHA256: 69f74147e3334731bc3a76048724833325d2ec74642fb52620eda87352e3d4f1
      # Whisper pads every window to 30 s, so on CPU only a 30 s window / 28 s
      # hop keeps up (1.18x realtime); partials lag up to one hop. Do NOT copy
      # these onto a GPU worker (infra/compose/gpu.yml keeps low-latency defaults).
      MDX_WINDOW_SECONDS: "30.0"
      MDX_WINDOW_MIN_FOR_PARTIAL_SECONDS: "28.0"
      # Greedy: beam 5 falls behind realtime on CPU for identical text.
      MD_ASR_BEAM_SIZE: "1"
      # Overlap is the commit horizon; widening it delays every commit.
      MDX_WINDOW_OVERLAP_SECONDS: "2.0"
      MDX_WORKER_ID: dictation-dev-1
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      REDIS_URL: redis://redis:6379/0
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      MDX_TMPFS_ROOT: /run/dictation
      # Keep in sync with x-cors-env.
      MDX_WS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:4173","http://127.0.0.1:4173","http://localhost:3000","https://vpu2301.github.io"]'
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
      - ${HOME}/.cache/huggingface/hub/models--Systran--faster-whisper-large-v3:/opt/models/whisper-large-v3:ro
    tmpfs:
      # RAM-backed so decrypted PCM never hits disk; owned by the nonroot uid.
      - /run/dictation:size=2g,mode=0700,uid=65532,gid=65532
    ports:
      - "127.0.0.1:8002:8000"
    # Loads large-v3 + warms ECAPA before binding (137-176 s measured), so the
    # shared 30 s start_period would report a normal start as unhealthy.
    healthcheck:
      <<: *svc-healthcheck
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  nlp-service:
    build:
      context: .
      dockerfile: services/nlp-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
      MDX_NLP_PUNCTUATION_DISABLED: "false"  # model is baked; needed for batch-transcript quality
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  note-service:
    build:
      context: .
      dockerfile: services/note-service/Dockerfile
    restart: unless-stopped
    environment: &note-env
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env, *s3-env]
      ASR_SERVICE_BASE_URL: http://asr-service:8000
      # manual = plan changes apply at once without payment (service default: none).
      MDX_BILLING_PROVIDER: "${MDX_BILLING_PROVIDER:-manual}"
      # Without this the default redis://localhost resolves to the container
      # itself and every notification publish silently no-ops.
      REDIS_URL: redis://redis:6379/0
      # Audio replay (ADR-0037) needs envelope crypto.
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/notes
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      # Google Calendar OAuth; empty client id hides the connect button.
      # The redirect URI must be registered at Google and reach THIS service.
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:8006/v1/calendar/google/callback}
      # Share mail; defaults to Mailpit so nothing escapes without a .env.
      MDX_EMAIL_PROVIDER: "${MDX_EMAIL_PROVIDER:-smtp}"
      MDX_NOTE_SMTP_HOST: "${MDX_NOTE_SMTP_HOST:-mailpit}"
      MDX_NOTE_SMTP_PORT: "${MDX_NOTE_SMTP_PORT:-1025}"
      MDX_NOTE_SMTP_USE_TLS: "${MDX_NOTE_SMTP_USE_TLS:-false}"
      MDX_NOTE_SMTP_USERNAME: "${MDX_NOTE_SMTP_USERNAME:-}"
      MDX_NOTE_SMTP_PASSWORD: "${MDX_NOTE_SMTP_PASSWORD:-}"
      MDX_NOTE_EMAIL_FROM: "${MDX_NOTE_EMAIL_FROM:-notes@notes-ai.local}"
      MDX_NOTE_EMAIL_FROM_NAME: "${MDX_NOTE_EMAIL_FROM_NAME:-Notes AI}"
      # Fallback Reply-To for a sharer with no address on file.
      MDX_NOTE_EMAIL_REPLY_TO: "${MDX_NOTE_EMAIL_REPLY_TO:-notes@notes-ai.local}"
      MDX_SHARE_EMAIL_TIMEOUT_S: "${MDX_SHARE_EMAIL_TIMEOUT_S:-15}"
      # Must be the origin the SPA is served from, or shared links 404.
      MDX_APP_BASE_URL: "${MDX_APP_BASE_URL:-http://localhost:5173}"
      # Chat backend (config/models.yaml): Mistral EU with the key, else this
      # Mac's Ollama (`models.route` in the startup log). Key from .env.local only.
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      MISTRAL_API_URL: "${MISTRAL_API_URL:-https://api.mistral.ai/v1}"
      MDX_DEV_CHAT_BACKEND: "${MDX_DEV_CHAT_BACKEND:-}"
      DEV_MAC_CONTEXT: "${DEV_MAC_CONTEXT:-16384}"
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:8006:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  # note-worker drains the note.generate queue (ADR-0058); without it notes
  # stay `queued`. `*note-env` is deliberate: the worker calls the API's own
  # build_state() and must have identical wiring. No HTTP, so no healthcheck.
  note-worker:
    build:
      context: .
      dockerfile: services/note-service/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "note_service.worker"]
    environment: *note-env
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  autocomplete-service:
    build:
      context: .
      dockerfile: services/autocomplete-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8007:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Layer C backend (ADR-0036): pinned gemma3:1b blob from the host's Ollama
  # store (`ollama pull gemma3:1b` once). CPU-only inside the Docker VM.
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - "-m"
      - "/models/gemma3-1b.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--parallel"
      - "2"
      - "-c"
      - "4096"
    volumes:
      - ~/.ollama/models/blobs/sha256-7cd4618c1faf8b7233c6c906dac1694b6a47684b37b8895d470ac688520b9c01:/models/gemma3-1b.gguf:ro
    ports:
      - "127.0.0.1:8089:8080"

  generation-service:
    build:
      context: .
      dockerfile: services/generation-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
      MDX_GEN_BACKEND: llamacpp
      MDX_GEN_BASE_URL: http://llama-server:8080
      MDX_GEN_MODEL: gemma3:1b
      # CPU inference exceeds the 600 ms prod budget; dev keeps it usable.
      MDX_GEN_TIMEOUT_MS: "6000"
    ports:
      - "127.0.0.1:8009:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      llama-server:
        # The image ships no probe tool; /readyz reflects backend readiness.
        condition: service_started

  # Dev SMTP sink: :8025 web inbox, :1025 SMTP; the PII gate reads its API.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
      MDX_APP_BASE_URL: http://localhost:5173
      MDX_EMAIL_PROVIDER: smtp
      MDX_SMTP_HOST: mailpit
      MDX_SMTP_PORT: "1025"
      MDX_EMAIL_FROM: noreply@notes-ai.local
