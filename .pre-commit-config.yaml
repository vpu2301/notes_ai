# Install: pip install pre-commit && pre-commit install; run all: pre-commit run -a

repos:
  # Pin MUST track the project's ruff, or the hook and `make lint` disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      # LOCAL hook in the project venv (the mirror's isolated env flags real
      # `type: ignore`s as unused); pass_filenames: false for the same reason.
      - id: mypy-foundation
        name: mypy --strict (secret + observability)
        entry: bash -c 'uv run --with "mypy>=1.10" mypy --strict libs/secret/src libs/observability/src'
        language: system
        pass_filenames: false
        files: (^|/)libs/(secret|observability)/src/.*\.py$

      - id: no-os-environ-in-services
        name: Reject os.environ outside config.py
        description: All envvar reads go through pydantic-settings in config.py.
        # language: system, as the scripts are not console entry points; the
        # exclude regex only trims the file list for speed.
        entry: python3 scripts/dev/check-no-os-environ.py
        language: system
        types: [python]
        exclude: (^|/)config\.py$|(^|/)(tests|scripts)/|(^|/)libs/secret/

      - id: no-direct-asyncpg
        name: Reject direct asyncpg.connect outside libs/db/
        description: Use libs/db.tenant_connection() — see ADR-0004.
        entry: python3 scripts/dev/check-no-direct-asyncpg.py
        language: system
        types: [python]
        exclude: (^|/)libs/db/|(^|/)(tests|scripts)/
